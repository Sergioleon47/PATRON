<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>PlatoCost — Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F0F2F5; --panel:#FFFFFF; --ink:#1C1E21; --ink-soft:#65676B; --line:#DDDFE2;
    /* Paleta "WhatsApp + Facebook": azul de Facebook (#1877F2) como color de marca/acciones
       principales, verde de WhatsApp (#25D366) para lo positivo/saludable — dos colores que
       todo el mundo reconoce y asocia con confianza, en vez de acentos inventados. */
    --navy:#1877F2; --navy-soft:#4293F5; --tomato:#E5484D; --saffron:#F5A623; --basil:#25D366;
    --basil-soft:#E5F9EA; --tomato-soft:#FCE7E7; --saffron-soft:#FDF0DA;
    --radius:14px; --shadow:0 1px 2px rgba(28,30,33,0.08), 0 8px 24px rgba(28,30,33,0.08);
    --stock-ok:#25D366; --stock-warn:#F5A623; --stock-crit:#E5484D;
  }
  *{box-sizing:border-box;}
  html{touch-action:manipulation;}
  body{margin:0;background:radial-gradient(ellipse 900px 480px at 50% -60px, #25D366 0%, #1877F2 55%, var(--bg) 85%) var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:28px 24px 100px;}

  .view-container{}
  .view-container.view-anim{animation:viewFadeIn .65s cubic-bezier(0.22,1,0.36,1);}
  @keyframes viewFadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .topbar .brand{order:1;}
  .topbar .topbar-actions{order:2;}
  .brand{display:flex;align-items:center;gap:2px;}
  .brand-mark{
    width:42px;height:42px;border-radius:11px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.14) 0 5px, transparent 5px 10px),
      linear-gradient(145deg,var(--navy),var(--basil));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:25px;box-shadow:var(--shadow);
  }
  .brand-name{font-size:20px;font-weight:700;}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  .lang-toggle{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);flex-shrink:0;transition:transform .2s ease, border-color .2s ease, color .2s ease;}
  .lang-toggle:hover{border-color:var(--navy);color:var(--navy);}
  .lang-toggle:active{transform:scale(0.92);}
  #btn-alert-settings, #btn-alert-settings:hover{color:var(--ink-soft);border-color:var(--line);}

  /* BOTTOM NAV */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(115deg,#1877F2,#25D366);border-top:1px solid rgba(255,255,255,0.15);display:flex;z-index:40;box-shadow:0 -4px 18px rgba(24,119,242,0.3);padding-bottom:env(safe-area-inset-bottom);}
  .bottom-nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 8px;color:rgba(255,255,255,0.65);font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;position:relative;font-family:'Inter';transition:color .25s ease;}
  .bottom-nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .bottom-nav-item.active{color:#fff;}
  .bottom-nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 3px 3px;background:#DCF8C6;}
  .bottom-nav-item:active{transform:scale(0.95);}

  .scan-card{cursor:pointer;}
  .scan-fab-mini{width:52px;height:52px;flex-shrink:0;position:relative;transition:transform .25s ease;}
  .scan-fab-mini-lg{width:76px;height:76px;}
  .scan-card:hover .scan-fab-mini{transform:scale(1.07);}
  .scan-card:active .scan-fab-mini{transform:scale(0.94);}
  .scan-fab-mini svg{position:relative;z-index:2;width:100%;height:100%;filter:drop-shadow(0 2px 5px rgba(32,33,36,0.25));}
  .scan-fab-ring{
    position:absolute;inset:0;border-radius:50%;background:rgba(229,72,77,0.35);
    animation:fabPulse 1.8s cubic-bezier(0.3,0.6,0.4,1) infinite; z-index:1;
  }
  .scan-fab-ring.delay{animation-delay:.6s;}
  @keyframes fabPulse{
    0%{transform:scale(1);opacity:.65;}
    100%{transform:scale(1.9);opacity:0;}
  }

  .grid-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--panel);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .stat-label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .stat-value{font-size:26px;font-weight:700;margin-top:6px;font-family:'Space Grotesk';}
  .stat-value.tomato{color:var(--tomato);} .stat-value.basil{color:var(--basil);} .stat-value.navy{color:var(--navy);} .stat-value.saffron{color:var(--saffron);}
  .stat-hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;margin:0;}
  .section-head p{font-size:13px;color:var(--ink-soft);margin:2px 0 0;}

  .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;transition:transform .25s ease, opacity .3s ease, background .3s ease;font-family:'Inter';}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-soft);}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
  .btn-icon{display:inline-flex;align-items:center;gap:7px;position:relative;}
  .btn-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .inv-header-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .alert-banner{background:var(--tomato-soft);border:1px solid #F2C6C8;border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;color:#B02A2F;font-size:13.5px;font-weight:600;}
  .alert-banner .count{background:var(--tomato);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;}

  .table-wrap{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px;}
  .table-wrap.scroll-list{max-height:340px;overflow-y:auto;}
  /* border-collapse:collapse rompe position:sticky en los th — este modo lo evita
     sin que se note visualmente (los bordes ya los dan los border-bottom de las celdas) */
  .scroll-list table{border-collapse:separate;border-spacing:0;}
  .scroll-list thead th{position:sticky;top:0;z-index:1;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:12px 16px;background:#FAFAF7;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.mono-cell{font-family:'IBM Plex Mono';}

  .price-updated{display:inline-block;background:var(--basil-soft);color:var(--basil);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}

  .link-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 6px;}
  .link-btn:hover{text-decoration:underline;}
  .link-btn.danger{color:var(--tomato);}


  /* STOCK ANALYTICS CARD */
  .stock-card{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 20px 0;margin-bottom:24px;}
  .stock-card-title{font-size:15px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-family:'Space Grotesk';margin:0 0 6px;}
  .stock-row-swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
  .stock-row-swipe:last-child{border-bottom:none;}
  .stock-row-delete-bg{position:absolute;inset:0;background:var(--stock-crit);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;}
  .stock-row-delete-btn{width:54px;height:54px;border-radius:50%;border:none;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-right:14px;transition:background .2s ease,transform .15s ease;}
  .stock-row-delete-btn:active{transform:scale(0.9);background:rgba(255,255,255,0.28);}
  .stock-row-delete-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .stock-row{display:flex;align-items:center;gap:16px;padding:16px 0;background:var(--panel);position:relative;touch-action:pan-y;user-select:none;}
  .stock-icon-ring{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--stock-ok);background:#fff;overflow:hidden;}
  .stock-icon-ring svg{width:30px;height:30px;display:block;filter:drop-shadow(0 1px 1.5px rgba(28,30,33,0.18));}
  .stock-icon-ring.warn{border-color:var(--stock-warn);}
  .stock-icon-ring.crit{border-color:var(--stock-crit);}
  .stock-icon-ring.none{border-color:#C7CAD1;}
  .stock-main{flex:1;min-width:0;}
  .stock-name{font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px;}
  .stock-bar-track{background:#E9EAEC;border-radius:20px;height:20px;overflow:hidden;position:relative;}
  .stock-bar-fill{height:100%;border-radius:20px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:34px;transition:width .4s ease;}
  .stock-bar-fill span{color:#fff;font-size:10.5px;font-weight:700;font-family:'IBM Plex Mono';white-space:nowrap;}
  .stock-bar-fill.ok{background:var(--stock-ok);}
  .stock-bar-fill.warn{background:var(--stock-warn);}
  .stock-bar-fill.crit{background:var(--stock-crit);}
  .stock-caption{font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .stock-caption-muted{font-style:italic;}
  .stock-actions{flex-shrink:0;text-align:center;}
  .stock-actions-btns{display:flex;gap:6px;}
  .stock-icon-btn{width:30px;height:30px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:#fff;transition:transform .2s ease;}
  .stock-icon-btn:active{transform:scale(0.9);}
  .stock-icon-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .stock-icon-btn.history{background:#9AA0A6;}
  .stock-icon-btn.edit{background:var(--navy);}
  .inv-row-meta{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px;}
  .stock-summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .stock-summary-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;font-weight:600;}
  .stock-summary-value{font-size:20px;font-weight:700;color:var(--stock-crit);font-family:'Space Grotesk';margin-top:2px;}
  .stock-summary-right{text-align:right;}
  .stock-suggest-btn{background:var(--stock-ok);color:#fff;border:none;border-radius:20px;padding:9px 18px;font-size:12px;font-weight:700;margin-top:4px;cursor:pointer;}
  .stock-suggest-btn:hover{opacity:.9;}
  .cc-due-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--tomato);border:2px solid var(--panel);}

  /* Tarjetas de recibos (grid con foto de portada), pestaña Recibos */
  .dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .dish-card{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(28,30,33,0.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-height:88vh;overflow-y:auto;}
  .modal.wide{max-width:600px;}
  .modal h3{margin:0 0 4px;font-size:18px;}
  .modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:'Inter';background:#FAFAF9;}
  .field input:focus,.field select:focus{outline:2px solid var(--navy-soft);border-color:var(--navy);background:#fff;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn{flex:1;}
  .helper-note{font-size:11.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px;}

  .add-ing-row{display:flex;gap:8px;align-items:flex-end;background:#FAFAF7;padding:12px;border-radius:10px;margin-bottom:12px;border:1px dashed var(--line);}
  .add-ing-row .field{margin-bottom:0;flex:1;}
  .ing-list-mini{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:180px;overflow-y:auto;}
  .ing-list-mini-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 10px;background:#FAFAF7;border-radius:8px;}
  .remove-x{background:none;border:none;color:var(--tomato);cursor:pointer;font-size:15px;padding:0 4px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .em-icon{font-size:34px;margin-bottom:10px;}


  .purchase-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);}
  .purchase-row:last-child{border-bottom:none;}
  .purchase-left{display:flex;flex-direction:column;}
  .purchase-name{font-weight:600;font-size:13.5px;}
  .purchase-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .purchase-amount{font-family:'IBM Plex Mono';font-weight:700;color:var(--navy);}

  /* RECEIPT SCAN */
  .drop-zone{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:#FAFAF7;margin-bottom:16px;}
  .drop-zone:hover{border-color:var(--navy);}
  .drop-zone .dz-icon{font-size:28px;margin-bottom:6px;}
  .receipt-preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-bottom:14px;border:1px solid var(--line);}
  .scan-status{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--saffron-soft);border-radius:10px;font-size:13px;font-weight:600;color:#8A5A1F;margin-bottom:14px;}
  .spinner{width:16px;height:16px;border:2.5px solid #F5DCC0;border-top-color:#8A5A1F;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .scan-error{background:var(--tomato-soft);color:#B02A2F;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px;}

  .matched-item{background:#FAFAF7;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .matched-item .mi-top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .matched-item .mi-top strong{color:var(--ink);font-size:13px;}
  .mi-fields{display:flex;gap:8px;}
  .mi-fields select, .mi-fields input{padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;}

  @media (max-width:720px){
    #app{padding:16px 14px 90px;}
    .topbar{margin-bottom:16px;row-gap:10px;}
    .table-wrap{overflow-x:auto;}
    .mi-fields{flex-direction:column;}
    .field-row{flex-wrap:wrap;}
    .dish-grid{grid-template-columns:1fr;}
    .modal{padding:20px;}
    .modal-actions{flex-wrap:wrap;}
  }

  @media (max-width:520px){
    .grid-summary{gap:10px;margin-bottom:16px;}
    .stat-card{padding:14px 12px;}
    .stat-label{white-space:normal;font-size:10.5px;}
    .stat-value{font-size:21px;}
    .scan-card{padding:6px 0;}

    /* Tabla de inventario (pestaña Inventario, no la del Dashboard): en vez de forzar
       scroll horizontal, se esconde la columna Categoría (se muestra como subtítulo bajo
       el nombre) y la de Unidad (ya va incluida en "Costo/unidad"), y las acciones se
       apilan si no entran en una línea. Escopado con :not(.scroll-list) para no afectar
       la tabla de últimas compras del Dashboard, que tiene sus propias columnas. */
    .table-wrap:not(.scroll-list) table{table-layout:fixed;}
    .table-wrap:not(.scroll-list) th:nth-child(2), .table-wrap:not(.scroll-list) td:nth-child(2){display:none;}
    th, td{padding:10px 8px;font-size:12.5px;}
    td:last-child{white-space:normal;}
    .link-btn{padding:4px 5px;font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= ESTADO INICIAL ================= */
let inventory = [
  {id:'i1', name:'Chicken breast', unit:'lb', costPerUnit:2.125, updated:false, qtyOnHand:0},
  {id:'i2', name:'Medium shrimp', unit:'lb', costPerUnit:8.50, updated:false, qtyOnHand:0},
  {id:'i3', name:'Mozzarella cheese', unit:'lb', costPerUnit:3.80, updated:false, qtyOnHand:0},
  {id:'i4', name:'Tomato', unit:'lb', costPerUnit:0.90, updated:false, qtyOnHand:0},
  {id:'i5', name:'Olive oil', unit:'oz', costPerUnit:0.1875, updated:false, qtyOnHand:0},
  {id:'i6', name:'Flour', unit:'lb', costPerUnit:0.56, updated:false, qtyOnHand:0},
  {id:'i7', name:'Flour tortilla', unit:'unidad', costPerUnit:0.30, updated:false, qtyOnHand:0},
];

let purchases = [
  {id:'p1', ingId:'i1', qty:40, totalPrice:85.00, supplier:'US Foods', date:'2026-08-01'},
  {id:'p2', ingId:'i2', qty:5, totalPrice:42.50, supplier:'Gulf Seafood Co.', date:'2026-07-30'},
  {id:'p3', ingId:'i4', qty:25, totalPrice:22.50, supplier:'Mercado Local', date:'2026-07-29'},
  {id:'p4', ingId:'i6', qty:25, totalPrice:14.00, supplier:'Sysco', date:'2026-07-12'},
  {id:'p5', ingId:'i3', qty:10, totalPrice:38.00, supplier:'Sysco', date:'2026-06-20'},
  {id:'p6', ingId:'i1', qty:40, totalPrice:82.00, supplier:'US Foods', date:'2026-06-05'},
];

let receipts = []; // historial: {id, images:[{base64,mediaType}, ...] (una o varias páginas), supplier, date, total, itemCount, appliedItems, createdAt, purchaseIds}
// Nota: recibos guardados antes de la migración a Claude API pueden tener el formato viejo
// de una sola foto (imageBase64 + mediaType) en vez de "images" — por eso receiptImages()
// abajo soporta ambos formatos en vez de asumir que todos los recibos ya son el nuevo.
let aliasMap = {}; // nombre normalizado del recibo -> ingredienteId, aprendido de correcciones previas
let receiptSearchQuery = '';

let activeTab = 'dashboard';
let lastRenderedTab = null;
let showItemModal=false, showPurchaseModal=false, showScanModal=false, showReceiptDetail=null;
let showPriceHistoryModal=false, priceHistoryIngId=null;
let showMonthlySpendModal=false;
let editingItem=null;
let draftItem=null;
let scanDuplicateOf=null; // receipt existente si se detecta posible duplicado
let scanDuplicateConfirmed=false;

let priceAlertThreshold = 15; // % de aumento que dispara la alerta fuerte al escanear — ajustable por el gerente
let showAlertSettingsModal = false;
let showSuggestedOrderModal = false;
let draftThreshold = priceAlertThreshold;

/* Conteo cíclico: cada X días, recuerda contar a mano un % del inventario, rotando
   qué productos toca cada vez (cycleCountCursor) para no repetir siempre los mismos. */
let cycleCountPct = 20;
let cycleCountIntervalDays = 3;
let cycleCountLastDate = null; // fecha (YYYY-MM-DD) del último conteo completado, o null si nunca se hizo
let cycleCountCursor = 0;
let showCycleCountModal = false;
let draftCycleCountPct = cycleCountPct;

/* ================= UTILIDADES ================= */
function uid(p){return p+Math.random().toString(36).slice(2,9);}
function money(n){return '$'+(isNaN(n)?'0.00':n.toFixed(2));}
/* Fecha/mes de "hoy" en hora LOCAL — a diferencia de toISOString() (que da la fecha en UTC),
   esto evita que a alguien en América se le adelante un día al escanear o registrar de noche. */
function localDateStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localMonthStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function addDaysStr(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return localDateStr(d);
}
function daysBetweenStr(fromStr, toStr){
  const a = new Date(fromStr+'T00:00:00'), b = new Date(toStr+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function isCycleCountDue(){
  if(inventory.length===0) return false;
  if(!cycleCountLastDate) return true; // nunca se hizo un conteo -> toca ahora
  return daysBetweenStr(cycleCountLastDate, localDateStr()) >= cycleCountIntervalDays;
}
/* Toma el siguiente % del inventario a partir de cycleCountCursor, rotando (con wrap-around)
   para que cada conteo cíclico caiga sobre productos distintos en vez de repetir los mismos. */
function cycleCountBatch(){
  if(inventory.length===0) return [];
  const n = Math.min(inventory.length, Math.max(1, Math.round(inventory.length*(cycleCountPct/100))));
  const list = [];
  for(let i=0;i<n;i++){ list.push(inventory[(cycleCountCursor+i)%inventory.length]); }
  return list;
}
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* Las fotos de un recibo, en el formato nuevo (varias páginas, desde que se migró a
   Claude API) o el viejo (una sola foto, recibos guardados antes de esa migración) —
   siempre devuelve un array, aunque sea de un solo elemento, para no repetir este
   if/else en cada lugar que necesita mostrar/imprimir/compartir la foto de un recibo. */
function receiptImages(r){
  if(Array.isArray(r.images) && r.images.length>0) return r.images;
  if(r.imageBase64) return [{base64:r.imageBase64, mediaType:r.mediaType}];
  return [];
}

/* ================= PERSISTENCIA (localStorage) ================= */
const STORAGE_KEY = 'platocost_data_v1';
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      inventory, purchases, receipts, aliasMap, priceAlertThreshold,
      cycleCountPct, cycleCountIntervalDays, cycleCountLastDate, cycleCountCursor
    }));
    return true;
  }catch(e){
    // El motivo más común es que el almacenamiento del navegador se llenó (las fotos de
    // recibos son lo que más espacio ocupa). Antes esto fallaba en silencio — el cambio se
    // perdía sin aviso y recién se notaba al refrescar. Ahora se avisa de inmediato para que
    // el usuario pueda liberar espacio (borrando recibos viejos) antes de perder algo más.
    console.warn('No se pudo guardar en localStorage (¿espacio lleno?)', e);
    alert(t('storage_full_warning'));
    return false;
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(Array.isArray(data.inventory)) inventory = data.inventory;
    if(Array.isArray(data.purchases)) purchases = data.purchases;
    if(Array.isArray(data.receipts)) receipts = data.receipts;
    if(data.aliasMap && typeof data.aliasMap==='object') aliasMap = data.aliasMap;
    if(typeof data.priceAlertThreshold==='number') priceAlertThreshold = data.priceAlertThreshold;
    if(typeof data.cycleCountPct==='number') cycleCountPct = data.cycleCountPct;
    if(typeof data.cycleCountIntervalDays==='number') cycleCountIntervalDays = data.cycleCountIntervalDays;
    if(typeof data.cycleCountLastDate==='string') cycleCountLastDate = data.cycleCountLastDate;
    if(typeof data.cycleCountCursor==='number') cycleCountCursor = data.cycleCountCursor;
  }catch(e){
    console.warn('No se pudo leer localStorage', e);
  }
}
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
const MONTH_NAMES = {
  es: ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
};
function monthLabel(key){
  const [y,m] = key.split('-');
  return MONTH_NAMES[uiLang][parseInt(m,10)-1]+' '+y;
}
/* % de cambio del costo del ingrediente vs. su compra anterior (las 2 últimas compras registradas) */
function lastPriceChangePct(ingId){
  const relevant = purchases
    .filter(p=>p.ingId===ingId && p.qty>0)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(relevant.length<2) return null;
  const latest = relevant[0].totalPrice/relevant[0].qty;
  const prev = relevant[1].totalPrice/relevant[1].qty;
  if(prev<=0) return null;
  return ((latest-prev)/prev)*100;
}
function priceChangeBadge(pct){
  if(pct===null) return '';
  const up = pct>0.5, down = pct<-0.5;
  const color = up?'var(--tomato)':down?'var(--basil)':'var(--ink-soft)';
  const arrow = up?'▲':down?'▼':'→';
  return `<span style="color:${color};font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap;">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
}
function allMonths(){
  const set = new Set([...purchases.map(p=>monthKey(p.date)), ...receipts.map(r=>monthKey(r.date))]);
  return [...set].sort().reverse();
}
/* IDs de compras que ya vinieron de un recibo escaneado (ver receipts[].purchaseIds).
   Sirve para no sumarlas de nuevo cuando el gasto ya se toma del total del recibo. */
function receiptLinkedPurchaseIds(){
  const set = new Set();
  receipts.forEach(r=>{ if(Array.isArray(r.purchaseIds)) r.purchaseIds.forEach(id=>set.add(id)); });
  return set;
}
/* El gasto del mes se arma con el monto real de cada recibo (no la suma de los
   productos que el OCR logró emparejar, que puede quedar corta si algo no se
   leyó bien) más las compras registradas a mano que no vienen de ningún recibo. */
function spendForMonth(key){
  const linkedIds = receiptLinkedPurchaseIds();
  const receiptTotal = receipts.filter(r=>monthKey(r.date)===key).reduce((s,r)=>s+(r.total||0),0);
  const manualTotal = purchases
    .filter(p=>monthKey(p.date)===key && !linkedIds.has(p.id))
    .reduce((s,p)=>s+p.totalPrice,0);
  return receiptTotal + manualTotal;
}

/* Categoría de ícono por ingrediente, heurística por palabras clave en el nombre.
   Placeholder de apariencia — cuando definamos el contenido real se puede
   reemplazar por un selector manual o por categoría. */
function stockIconKey(name){
  const n = (name||'').toLowerCase();
  if(/beef|res\b|steak|carne de res|ground beef|molida/.test(n)) return 'beef';
  if(/pork|cerdo|bacon|tocino|jamon|jamón|\bham\b/.test(n)) return 'pork';
  if(/sausage|salchicha|chorizo/.test(n)) return 'sausage';
  if(/chicken|pollo/.test(n)) return 'chicken';
  if(/shrimp|camar/.test(n)) return 'shrimp';
  if(/fish|pescado|seafood|marisco|salmon|tilapia|atun|tuna/.test(n)) return 'fish';
  if(/\beggs?\b|huevo/.test(n)) return 'egg';
  if(/cheese|queso/.test(n)) return 'cheese';
  if(/milk|leche|cream|crema|butter|mantequilla|yogurt|yogur/.test(n)) return 'dairy';
  if(/tomato|tomate/.test(n)) return 'tomato';
  if(/onion|cebolla/.test(n)) return 'onion';
  if(/garlic|\bajo\b/.test(n)) return 'garlic';
  if(/lettuce|lechuga|spinach|espinaca|kale|arugula|r[úu]cula|greens/.test(n)) return 'lettuce';
  if(/pimienta|black pepper|paprika|comino|cumin|or[ée]gano|canela|cinnamon|clove|chili powder|especia|spice/.test(n)) return 'spice';
  if(/chili|chile|jalape|poblano|serrano|habanero|cayenne/.test(n)) return 'chili';
  if(/pepper|pimiento|piment[oó]n|bell pepper/.test(n)) return 'pepper';
  if(/potato|papas?\b|patata/.test(n)) return 'potato';
  if(/carrot|zanahoria/.test(n)) return 'carrot';
  if(/cucumber|pepino/.test(n)) return 'cucumber';
  if(/avocado|aguacate|palta/.test(n)) return 'avocado';
  if(/lime|lemon|limas?\b|lim[oó]n/.test(n)) return 'lime';
  if(/\bcorn\b|ma[ií]z|elote/.test(n)) return 'corn';
  if(/mushroom|hongo|champi/.test(n)) return 'mushroom';

  if(/pasta|spaghetti|fideo|noodle/.test(n)) return 'pasta';
  if(/flour|harina/.test(n)) return 'flour';
  if(/sugar|az[uú]car/.test(n)) return 'sugar';
  if(/\bsalt\b|\bsal\b/.test(n)) return 'salt';
  if(/ketchup|catsup/.test(n)) return 'ketchup';

  if(/mayo|mayonnaise|mayonesa/.test(n)) return 'mayo';
  if(/vinegar|vinagre/.test(n)) return 'vinegar';
  if(/oil|aceite/.test(n)) return 'oil';
  if(/soda|soft drink|refresco|gaseosa|\bcola\b|sprite|pepsi/.test(n)) return 'soda';
  if(/juice|jugo|zumo/.test(n)) return 'juice';
  if(/coffee|caf[eé]/.test(n)) return 'coffee';

/* Un brillo suave arriba-a-la-izquierda le da a cualquier ícono plano una sensación
   de profundidad/pulido (como un ícono de app premium) sin tener que rehacer a mano
   cada una de las 46 ilustraciones — se agrega una sola vez acá, encima de lo que sea. */
function stockIconSvg(name){
  const key = stockIconKey(name);
  return `<svg viewBox="0 0 48 48">${STOCK_ICONS[key] || STOCK_ICONS.box}<ellipse cx="17" cy="13" rx="10" ry="6.5" fill="#fff" opacity="0.22"/></svg>`;
}
function stockStatus(pct){ return pct>=60 ? 'ok' : pct>=20 ? 'warn' : 'crit'; }

/* stockTarget es un placeholder mientras definimos de dónde sale el "stock objetivo"
   real (ver conversación pendiente) — por ahora se estima a partir de lo que hay.
   Un ingrediente que nunca tuvo una compra registrada y sigue en 0 no es "crítico"
   de verdad — todavía no hay datos para juzgarlo, así que se marca aparte ('none')
   en vez de asustar a un usuario nuevo con todo el inventario en rojo desde el día 1. */
function stockRowsData(){
  return inventory.map(i=>{
    const hasHistory = (i.qtyOnHand||0)>0 || purchases.some(p=>p.ingId===i.id);
    const target = i.stockTarget || Math.max(Math.round((i.qtyOnHand||0)*1.5), 10);
    const pct = target>0 ? Math.min(100, Math.round(((i.qtyOnHand||0)/target)*100)) : 0;
    return {ing:i, target, pct, status: hasHistory ? stockStatus(pct) : 'none'};
  });
}

  if(inventory.length===0) return '';
  const rows = stockRowsData();
  const criticalCount = rows.filter(r=>r.status==='crit').length;
  return `

function recibosView(){
  const query = receiptSearchQuery.trim().toLowerCase();
  const filtered = receipts.filter(r=>{
    if(!query) return true;
    const supplierMatch = (r.supplier||'').toLowerCase().includes(query);
    const itemMatch = (r.appliedItems||[]).some(it=>(it.rawName||'').toLowerCase().includes(query));
    return supplierMatch || itemMatch;
  });
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));

  // de scrollear una sola lista larga, igual que ya se hace con el gasto mensual.
  const groups = [];

function priceHistoryChart(points){
  const W = 560, H = 180, padL = 52, padR = 16, padT = 16, padB = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const prices = points.map(p=>p.unitPrice);
  let min = Math.min(...prices), max = Math.max(...prices);
  if(min===max){ min = min*0.9; max = (max*1.1)||1; } // evita aplanar la gráfica si el precio nunca cambió

  const xFor = (i)=> padL + (points.length===1 ? innerW/2 : (i/(points.length-1))*innerW);
  const yFor = (v)=> padT + innerH - ((v-min)/(max-min))*innerH;

  const first = points[0].unitPrice, last = points[points.length-1].unitPrice;
  const changePct = first>0 ? ((last-first)/first)*100 : 0;
  const trendColor = changePct>3 ? 'var(--tomato)' : changePct<-3 ? 'var(--basil)' : 'var(--navy)';

  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH*f;
    const val = max - (max-min)*f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${money(val)}</text>`;
  }).join('');

  const linePoints = points.map((p,i)=> `${xFor(i).toFixed(1)},${yFor(p.unitPrice).toFixed(1)}`).join(' ');

  const markers = points.map((p,i)=>{
    const x=xFor(i).toFixed(1), y=yFor(p.unitPrice).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="4" fill="${trendColor}" stroke="var(--panel)" stroke-width="2">
      <title>${escapeHtml(p.date)} · ${escapeHtml(p.supplier)} · ${money(p.unitPrice)}</title>
    </circle>`;
  }).join('');

  const lastX = xFor(points.length-1), lastY = yFor(last);
  const endLabel = `<text x="${lastX.toFixed(1)}" y="${(lastY-10).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono">${money(last)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${gridLines}
    <polyline points="${linePoints}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${markers}
    ${endLabel}
  </svg>`;
}

/* Agrupa las compras de un ingrediente por proveedor, para poder comparar quién
   te está cobrando más caro sin tener que leer todo el historial a mano */
function supplierComparisonRows(points){
  const bySupplier = {};
  points.forEach(p=>{
    const key = (p.supplier||'').trim() || t('fallback_unspecified');
    if(!bySupplier[key]) bySupplier[key] = {supplier:key, prices:[], lastDate:'', lastPrice:0};
    bySupplier[key].prices.push(p.unitPrice);
    if(p.date >= bySupplier[key].lastDate){ bySupplier[key].lastDate = p.date; bySupplier[key].lastPrice = p.unitPrice; }
  });
  return Object.values(bySupplier)
    .map(s=>({supplier:s.supplier, lastPrice:s.lastPrice, avgPrice:s.prices.reduce((a,b)=>a+b,0)/s.prices.length, count:s.prices.length}))
    .sort((a,b)=>a.lastPrice-b.lastPrice);
}

function monthlySpendChart(monthsAsc, currentMonthKey){
  const W = 560, H = 200, padL = 52, padR = 16, padT = 16, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const spends = monthsAsc.map(m=>spendForMonth(m));
  const max = Math.max(...spends, 1);

  const n = monthsAsc.length;
  const slot = innerW / n;
  const barW = Math.min(slot * 0.55, 24);

  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH*(1-f);
    const val = max*f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${money(val)}</text>`;
  }).join('');

  const bars = monthsAsc.map((m,i)=>{
    const spend = spends[i];
    const barH = max>0 ? (spend/max)*innerH : 0;
    const x = padL + i*slot + (slot-barW)/2;
    const y = padT + innerH - barH;
    const isCurrent = m===currentMonthKey;
    const color = isCurrent ? 'var(--navy)' : '#B7C4CC';
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,2).toFixed(1)}" rx="4" fill="${color}">
        <title>${escapeHtml(monthLabel(m))} · ${money(spend)}</title>
      </rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono">${money(spend)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(padT+innerH+16).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${escapeHtml(monthLabel(m))}</text>
    `;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${gridLines}
    ${bars}
  </svg>`;
}

function fileToBase64(file){
  // Redimensiona/comprime la foto antes de guardarla — esta es la copia que se queda
  // para siempre en el historial de recibos, y localStorage tiene un límite chico
  // (unos 5-10MB según el navegador). Una foto de celular sin comprimir llenaría ese
  // límite en pocos recibos. 1100px de lado más largo y calidad 0.75 siguen siendo
  // más que suficientes para leer un recibo en pantalla o imprimirlo.
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX_SIDE = 1100;
        let {width, height} = img;
        if(width > MAX_SIDE || height > MAX_SIDE){
          const scale = MAX_SIDE / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        resolve({base64: dataUrl.split(',')[1], mediaType: 'image/jpeg'});
      };
      img.onerror = ()=> reject(new Error(t('err_img_process')));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error(t('err_img_read')));
    reader.readAsDataURL(file);
  });
}

/* Comprime una foto nueva y la agrega como una página más del recibo que se está
   escaneando. Se puede llamar varias veces (una por página) antes de mandar todo

   — no está en el bloque de código viejo de más abajo aunque antes vivía ahí. */
async function addScanPage(file){
  try{
    const compressed = await fileToBase64(file);
    scanImages.push({base64: compressed.base64, mediaType: compressed.mediaType});
    scanState='idle';
    render();
  }catch(err){
    scanErrorMsg = err.message || t('err_img_process');
    scanState='error';
    render();
  }
}

/* Umbral de Otsu: encuentra automáticamente el punto de corte blanco/negro
   que mejor separa el texto del fondo, sin importar cuán clara o sucia esté la foto. */
function otsuThreshold(hist, total){
  let sum = 0;
  for(let t=0;t<256;t++) sum += t*hist[t];
  let sumB=0, wB=0, wF=0, varMax=0, threshold=127;
  for(let t=0;t<256;t++){
    wB += hist[t];
    if(wB===0) continue;
    wF = total - wB;
    if(wF===0) break;
    sumB += t*hist[t];
    const mB = sumB/wB, mF = (sum-sumB)/wF;
    const between = wB*wF*(mB-mF)*(mB-mF);
    if(between>varMax){ varMax=between; threshold=t; }
  }
  return threshold;
}

/* Prepara una versión de la foto optimizada específicamente para lectura OCR:
   más resolución que la copia comprimida que se guarda (ayuda con letra chica),
   en escala de grises y binarizada con Otsu (mejora mucho la lectura en recibos
   con poco contraste, sombras o papel térmico gastado). La foto a color que se
   guarda en el historial no se toca, esto es solo para que Tesseract lea mejor. */
function prepareOcrImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX_SIDE = 2200;
        let {width, height} = img;
        if(width > MAX_SIDE || height > MAX_SIDE){
          const scale = MAX_SIDE / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        try{
          const imgData = ctx.getImageData(0, 0, width, height);
          const d = imgData.data;
          const total = width*height;
          const gray = new Uint8ClampedArray(total);
          const hist = new Array(256).fill(0);
          for(let i=0, p=0; i<d.length; i+=4, p++){
            const g = Math.round(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
            gray[p] = g; hist[g]++;
          }
          const threshold = otsuThreshold(hist, total);
          for(let i=0, p=0; i<d.length; i+=4, p++){
            const v = gray[p] > threshold ? 255 : 0;
            d[i]=v; d[i+1]=v; d[i+2]=v;
          }
          ctx.putImageData(imgData, 0, 0);
        }catch(e){
          // Si el preprocesado falla por lo que sea, seguimos con la imagen a color sin tocar
        }
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=> reject(new Error(t('err_img_process')));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error(t('err_img_read')));
    reader.readAsDataURL(file);
  });
}

/* Carga Tesseract.js (OCR gratis en el navegador) solo la primera vez que se usa,
   igual que el patrón ya usado para OCR de recibos en Nudgy. No requiere API key
   ni backend, así que funciona igual en local, en Netlify o donde sea. */
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = ()=>resolve();
    script.onerror = ()=>{ tesseractLoadPromise=null; reject(new Error(t('err_ocr_load'))); };
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}

/* Convierte "1.234,56" o "1,234.56" a número usando el último separador como decimal */
function normalizeReceiptNumber(str){
  let s = String(str).trim();
  const lastComma = s.lastIndexOf(',');
  const lastDot = s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    s = lastComma>lastDot ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(lastComma>-1){
    s = s.replace(',','.');
  }
  return parseFloat(s);
}

/* Líneas que casi seguro NO son un producto (totales, impuestos, encabezados, etc.) */
const RECEIPT_LINE_BLACKLIST = /\btotal\b|\bsubtotal\b|\biva\b|\bimpuesto\b|\btax\b|\bcambio\b|\befectivo\b|\bcash\b|\bchange\b|\bgracias\b|\bthank|\bfactura\b|\binvoice\b|\brecibo\b|\breceipt\b|\bticket\b|\bfecha\b|\bdate\b|tel[eé]fono|\bphone\b|direcci[oó]n|\baddress\b|\bcliente\b|\bcustomer\b|\bcaja\b|\bcashier\b|\batendido\b|art[ií]culo|cant\.|\bqty\b|\bprecio\b|\bprice\b|www\.|http|\bc[oó]digo\b|\bsku\b|descripci[oó]n|\bdescription\b|\bunidad(es)?\b|\bumd\b|p\.?\s?unit|\bimporte\b|\bneto\b|\bbruto\b|\bfolio\b|\borden\b|\border\b|\bpo#|n[°º]\s?\d|\bref(erencia)?\b|\bvendedor\b|\bseller\b|\brfc\b|\bnit\b|\bruc\b|p[aá]gina|page \d|\bfirma\b|\bsignature\b|\bcopia\b|\boriginal\b/i;

/* Parseo heurístico de recibo a partir del texto plano que devuelve el OCR.
   No es tan preciso como una IA que "ve" la imagen — por eso cada producto
   queda editable antes de aplicarse, y se puede agregar uno a mano si el
   OCR no detectó nada. */
function parseReceiptText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);

  let date = '';
  const isoMatch = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  const dmyMatch = text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if(isoMatch){
    date = isoMatch[0];
  } else if(dmyMatch){
    let [, a, b, y] = dmyMatch;
    if(y.length===2) y = '20'+y;
    a = a.padStart(2,'0'); b = b.padStart(2,'0');
    // Los proveedores de este rubro suelen ser distribuidoras de EE.UU. (US Foods, Sysco, etc.),
    // que imprimen la fecha como MM/DD/AAAA — probamos ese orden primero. Si el primer número
    // no puede ser un mes válido (ej. "29/07/2026"), lo tratamos como DD/MM en vez de descartar
    // la fecha del todo.
    if(+a>=1 && +a<=12 && +b>=1 && +b<=31){
      date = `${y}-${a}-${b}`;
    } else if(+b>=1 && +b<=12 && +a>=1 && +a<=31){
      date = `${y}-${b}-${a}`;
    }
  }

  let supplier = '';
  for(const line of lines.slice(0,5)){
    if(/[a-zA-ZñÑáéíóúÁÉÍÓÚ]{3,}/.test(line) && !RECEIPT_LINE_BLACKLIST.test(line) && !/^\d+$/.test(line)){
      const clean = line.replace(/[^\wñÑáéíóúÁÉÍÓÚ\s.&-]/g,'').trim();
      if(clean){ supplier = clean; break; }
    }
  }

  const priceAtEnd = /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*$/;
  // "2 x Producto", "2x Producto" o "1 @ $1.79" / "1@ $1.79" (el OCR a veces pega el "@" a la
  // cantidad sin espacio, así que "@" no exige espacio detrás como sí lo exige "x")
  const leadingQty = /^(\d{1,3}(?:[.,]\d{1,3})?)\s*(?:[xX@]\s*|\s+)/;
  const bareNumberTok = /^\d+(?:[.,]\d+)?$/;
  // Unidades/palabras de relleno que NO cuentan como "nombre real" cuando decidimos si una
  // línea trae su propio nombre de producto o si es solo la cantidad/precio de la línea anterior
  const UNIT_FILLER_WORDS = new Set(['lb','lbs','kg','kgs','oz','g','gr','ml','l','ea','pc','pcs','unidad','unid','un']);
  function hasRealNameWords(str){
    return str.split(' ').some(tok=>{
      const clean = tok.replace(/[^a-zA-ZñÑáéíóúÁÉÍÓÚ]/g,'');
      return clean.length>=3 && !UNIT_FILLER_WORDS.has(clean.toLowerCase());
    });
  }

  const items = [];
  // Recibos de supermercado suelen traer el nombre del producto en su propia línea y la
  // cantidad/precio en la línea de abajo (ej. "ROMA TOMATOES" / "2.35 lb @ $1.99/lb  $4.68").
  // Guardamos la última línea de texto "con pinta de nombre" para usarla si la siguiente
  // línea con precio resulta ser solo cantidad/unidad, sin nombre propio.
  let pendingName = '';
  for(const line of lines){
    if(RECEIPT_LINE_BLACKLIST.test(line)){ pendingName=''; continue; }
    const priceMatch = line.match(priceAtEnd);
    if(!priceMatch){
      if(/[a-zA-ZñÑáéíóúÁÉÍÓÚ]{3,}/.test(line) && !/\d{3,}/.test(line)){
        const clean = line.replace(/[^\wñÑáéíóúÁÉÍÓÚ\s.&-]/g,'').trim();
        if(clean) pendingName = clean;
      }
      continue;
    }
    const price = normalizeReceiptNumber(priceMatch[1]);
    if(!price || price<=0 || price>100000){ pendingName=''; continue; }
    let rest = line.slice(0, priceMatch.index).trim();
    rest = rest.replace(/[.\-·•]{2,}/g,' ').replace(/\s{2,}/g,' ').trim();
    const tokens = rest.split(' ');

    // Facturas de proveedor suelen traer columnas "cant" y "precio unitario" en medio
    // de la línea (no al principio). Las encontramos verificando cant × precio_unit ≈ total
    // — así no confundimos la cantidad real con un código de producto u otro número suelto.
    let qty = 1, qtyIdx = -1, priceIdx = -1;
    const numericIdxs = [];
    tokens.forEach((tok,idx)=>{ if(bareNumberTok.test(tok)) numericIdxs.push(idx); });
    outer:
    for(const qi of numericIdxs){
      for(const pi of numericIdxs){
        if(qi===pi) continue;
        const qv = normalizeReceiptNumber(tokens[qi]);
        const pv = normalizeReceiptNumber(tokens[pi]);
        if(qv<=0 || qv>=1000 || pv<=0) continue;
        if(Math.abs(qv*pv - price) <= Math.max(0.02, price*0.01)){
          qty = qv; qtyIdx = qi; priceIdx = pi;
          break outer;
        }
      }
    }

    let name, qtyVerified = false;
    const qtyMatch = rest.match(leadingQty);
    const restAfterQty = qtyMatch ? rest.slice(qtyMatch[0].length) : rest;

    if(qtyIdx>-1){
      // La cantidad se cruzó contra el precio (cant × precio_unit ≈ total), así que es confiable
      const nameTokens = tokens.filter((_,idx)=> idx!==qtyIdx && idx!==priceIdx && !/^[xX]$/.test(tokens[idx]));
      name = nameTokens.join(' ').replace(/^[^a-zA-ZñÑáéíóúÁÉÍÓÚ]*/,'').trim();
      qtyVerified = true;
    } else if(qtyMatch && pendingName && !hasRealNameWords(restAfterQty)){
      // La línea es solo "cantidad @ precio" (ej. "1 @ $1.79"), sin nombre propio —
      // el nombre real vino en la línea de arriba
      const q = normalizeReceiptNumber(qtyMatch[1]);
      if(q>0 && q<1000) qty = q;
      name = pendingName;
    } else if(qtyMatch){
      // "2 x Producto ... precio" (con o sin espacio pegado al "x"/"@") — el nombre viene
      // después de la cantidad, usamos restAfterQty en vez de tokens de toda la línea para
      // no arrastrar la cantidad pegada al nombre (ej. "2xManzana" → "Manzana", no "xManzana")
      const q = normalizeReceiptNumber(qtyMatch[1]);
      if(q>0 && q<1000) qty = q;
      const nameTokens = restAfterQty.split(' ').filter(tok=>tok && !bareNumberTok.test(tok) && !/^[xX]$/.test(tok));
      name = nameTokens.join(' ').replace(/^[^a-zA-ZñÑáéíóúÁÉÍÓÚ]*/,'').trim();
    } else {
      // "Producto ... precio", sin ningún indicio de cantidad al principio
      const nameTokens = tokens.filter(tok=>!bareNumberTok.test(tok) && !/^[xX]$/.test(tok));
      name = nameTokens.join(' ').replace(/^[^a-zA-ZñÑáéíóúÁÉÍÓÚ]*/,'').trim();
    }

    pendingName = '';
    if(name.length<2) continue;
    items.push({name, quantity:qty, unit:'unidad', total_price:price, qtyVerified});
    if(items.length>=40) break;
  }

  return {supplier, date, items};
}

async function processReceiptImage(){
  if(scanImages.length===0) return;
  scanState='loading';
  scanErrorMsg='';
  render();
  try{
    // Manda TODAS las páginas juntas a nuestra Netlify Function, que a su vez
    // le pregunta a Claude (con visión) qué dice la factura completa —
    // combinando las páginas como un solo documento. La API key vive solo en
    // el servidor de Netlify, nunca en este archivo ni en el navegador.
    let response;
    try{
      response = await fetch('/.netlify/functions/extract-receipt', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ images: scanImages })
      });
    }catch(netErr){
      throw new Error(t('err_ocr_read'));
    }

    let parsed;
    try{
      parsed = await response.json();
    }catch(parseErr){
      // La función de Netlify no devolvió JSON — lo más probable es que no esté publicada
      // todavía (o esté mal ubicada) y el pedido cayó en una página de error genérica.
      throw new Error(t('err_function_not_found'));
    }
    if(!response.ok || parsed.error){
      throw new Error(parsed.error || t('err_generic_receipt'));
    }
    if(!Array.isArray(parsed.items) || parsed.items.length===0){
      throw new Error(t('err_no_text'));
    }

    scanSupplier = parsed.supplier || '';
    scanDate = parsed.date || localDateStr();
    scanInvoiceTotal = typeof parsed.invoice_total==='number' ? parsed.invoice_total : (parseFloat(parsed.invoice_total)||null);

    scanExtracted = parsed.items.map(it=>{
      const nameLower = (it.name||'').toLowerCase().trim();
      let matchedId = null;
      // 1. Prioridad: alias aprendido de una corrección manual anterior
      if(aliasMap[nameLower] && inventory.some(ing=>ing.id===aliasMap[nameLower])){
        matchedId = aliasMap[nameLower];
      } else {
        // 2. Coincidencia por texto contenido
        const existing = inventory.find(ing=> nameLower.includes(ing.name.toLowerCase()) || ing.name.toLowerCase().includes(nameLower));
        matchedId = existing ? existing.id : '__new__';
      }
      return {
        rawName: it.name || t('fallback_no_product_name'),
        qty: typeof it.quantity==='number' ? it.quantity : parseFloat(it.quantity)||0,
        totalPrice: typeof it.total_price==='number' ? it.total_price : parseFloat(it.total_price)||0,
        unit: it.unit || 'unidad',
        matchedIngId: matchedId,
        // Reusa el mismo aviso visual de "revisa esto" que ya tenías para
        // cantidades no verificadas, pero ahora basado en la confianza que
        // Claude reporta para esa línea (baja = probable tachón, letra
        // difícil, o algo que no pudo leer con seguridad).
        qtyVerified: it.confidence !== 'baja'
      };
    });

    // Detección de posible recibo duplicado: mismo proveedor + fecha + total aproximado.
    // Preferimos el total impreso de la factura (más confiable) y si no vino, la suma
    // de las líneas leídas — el mismo criterio que se usa para guardar el recibo.
    const compareTotal = scanInvoiceTotal>0 ? scanInvoiceTotal : scanExtracted.reduce((s,it)=>s+it.totalPrice,0);
    scanDuplicateOf = receipts.find(r=>
      (r.supplier||'').toLowerCase()===(scanSupplier||'').toLowerCase() &&
      r.date===scanDate &&
      Math.abs(r.total-compareTotal)<0.5
    ) || null;
    scanDuplicateConfirmed = false;

    scanState='matched';
    render();
  }catch(err){
    scanErrorMsg = err.message || t('err_generic_receipt');
    scanState='error';
    render();
  }
}

function applyScanResults(){
  if(scanDuplicateOf && !scanDuplicateConfirmed) return; // seguridad extra, el botón ya debería estar deshabilitado

  const appliedItems = [];
  const createdPurchaseIds = [];
  scanExtracted.forEach(item=>{
    if(item.qty<=0 || item.totalPrice<=0 || !item.rawName || !item.rawName.trim()) return;
    let ingId = item.matchedIngId;
    let ingName = '';
    if(ingId==='__new__'){
      const newIng = {id:uid('i'), name:item.rawName, unit:item.unit||'unidad', costPerUnit:item.totalPrice/item.qty, updated:true, qtyOnHand:item.qty};
      inventory.push(newIng);
      ingId = newIng.id;
      ingName = newIng.name;
    } else {
      const ing = inventory.find(i=>i.id===ingId);
      if(ing){
        ing.costPerUnit = item.totalPrice/item.qty;
        ing.updated = true;
        ing.qtyOnHand = (ing.qtyOnHand||0) + item.qty;
        ingName = ing.name;
      }
    }
    // Aprende la relación nombre-del-recibo -> ingrediente, para reconocerlo solo la próxima vez
    aliasMap[(item.rawName||'').toLowerCase().trim()] = ingId;

    const purchaseId = uid('p');
    purchases.push({id:purchaseId, ingId, qty:item.qty, totalPrice:item.totalPrice, supplier:scanSupplier||t('fallback_scanned'), date:scanDate});
    createdPurchaseIds.push(purchaseId);
    appliedItems.push({rawName:item.rawName, qty:item.qty, unit:item.unit, totalPrice:item.totalPrice, ingName});
  });

  if(appliedItems.length>0){
    const itemsSum = appliedItems.reduce((s,i)=>s+i.totalPrice,0);
    // Preferimos el total impreso de la factura (lo que de verdad se pagó, incluye
    // impuestos/cargos que no vienen como línea de producto) sobre la suma de los
    // productos confirmados, que puede quedar corta si algo no se leyó o se sacó de la lista.
    const receiptTotal = scanInvoiceTotal>0 ? scanInvoiceTotal : itemsSum;
    receipts.push({
      id:uid('r'), images:scanImages.slice(),
      supplier:scanSupplier||t('fallback_unspecified'), date:scanDate,
      total: receiptTotal,
      itemCount: appliedItems.length, appliedItems, createdAt: new Date().toISOString(),
      purchaseIds: createdPurchaseIds
    });
  }
  saveState();
  closeScanModal();
}

/* Borra un recibo y las compras que generó (así el gasto mensual y el historial de
   precio no quedan contaminados con un recibo escaneado por error o duplicado).
   Los recibos guardados antes de este cambio no tienen purchaseIds — en ese caso
   solo se borra el registro del recibo, sin tocar compras. */
function deleteReceipt(receiptId){
  const r = receipts.find(x=>x.id===receiptId);
  if(!r) return;
  if(!confirm(t('confirm_delete_receipt'))) return;
  if(Array.isArray(r.purchaseIds) && r.purchaseIds.length>0){
    const idSet = new Set(r.purchaseIds);
    // Antes de borrarlas, restamos del stock lo que esas compras habían sumado —
    // si no, borrar un recibo escaneado por error dejaría cantidades fantasma en inventario
    purchases.filter(p=>idSet.has(p.id)).forEach(p=>{
      const ing = inventory.find(i=>i.id===p.ingId);
      if(ing) ing.qtyOnHand = Math.max(0, (ing.qtyOnHand||0) - p.qty);
    });
    purchases = purchases.filter(p=>!idSet.has(p.id));
  }
  receipts = receipts.filter(x=>x.id!==receiptId);
  saveState();
  showReceiptDetail = null;
  render();
}

function printReceipt(r){
  const w = window.open('', '_blank');
  if(!w) return; // ventana emergente bloqueada por el navegador
  const rows = r.appliedItems.map(it=>`
    <tr><td>${escapeHtml(it.rawName)}</td><td>${it.qty} ${escapeHtml(unitLabel(it.unit))}</td><td>${money(it.totalPrice)}</td></tr>
  `).join('');
  const imgsHtml = receiptImages(r).map(img=>`<img src="data:${img.mediaType};base64,${img.base64}">`).join('');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(r.supplier)||t('no_supplier_name')}</title>
    <style>
      body{font-family:-apple-system,sans-serif;padding:24px;color:#1C1C1E;max-width:480px;margin:0 auto;}
      h2{margin:0 0 4px;} .meta{color:#5F6368;font-size:13px;margin-bottom:16px;}
      img{max-width:100%;border-radius:8px;margin-bottom:16px;display:block;}
      table{width:100%;border-collapse:collapse;} th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #ddd;font-size:13px;}
      tfoot td{font-weight:700;border-bottom:none;padding-top:10px;}
    </style></head><body>
    <h2>${escapeHtml(r.supplier)||t('no_supplier_name')}</h2>
    <div class="meta">${escapeHtml(r.date)}</div>
    ${imgsHtml}
    <table>
      <thead><tr><th>${t('th_ingredient')}</th><th>${t('lbl_qty_bought')}</th><th>${t('th_cost_unit').split('/')[0]}</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="2">${t('lbl_total_paid')}</td><td>${money(r.total)}</td></tr></tfoot>
    </table>
    </body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

function downloadReceiptImage(r){
  const imgs = receiptImages(r);
  imgs.forEach((img,idx)=>{
    const ext = (img.mediaType||'image/jpeg').includes('png') ? 'png' : 'jpg';
    const suffix = imgs.length>1 ? `-p${idx+1}` : '';
    const a = document.createElement('a');
    a.href = `data:${img.mediaType};base64,${img.base64}`;
    a.download = `receipt-${r.date||'sin-fecha'}${suffix}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
}

async function shareReceipt(r){
  const label = `${r.supplier||t('no_supplier_name')} — ${r.date}`;
  const imgs = receiptImages(r);
  if(navigator.share && imgs.length>0){
    try{
      const files = await Promise.all(imgs.map(async (img,idx)=>{
        const res = await fetch(`data:${img.mediaType};base64,${img.base64}`);
        const blob = await res.blob();
        const ext = (img.mediaType||'image/jpeg').includes('png') ? 'png' : 'jpg';
        const suffix = imgs.length>1 ? `-p${idx+1}` : '';
        return new File([blob], `receipt-${r.date||'sin-fecha'}${suffix}.${ext}`, {type:img.mediaType});
      }));
      const shareData = (navigator.canShare && navigator.canShare({files}))
        ? {files, title:label, text:label}
        : {title:label, text:label};
      await navigator.share(shareData);
      return;
    }catch(e){
      if(e && e.name==='AbortError') return; // el usuario cerró el panel de compartir, no es un error
    }
  }
  // Sin Web Share API disponible (la mayoría de navegadores de escritorio): descarga las fotos
  // para que el usuario las comparta a mano por donde prefiera.
  downloadReceiptImage(r);
}

/* ================= SWIPE PARA BORRAR (Estado del inventario) ================= */
let openSwipeRow = null; // wrap element actualmente abierto (mostrando el fondo rojo), o null

function closeOpenSwipe(){
  if(openSwipeRow){
    const row = openSwipeRow.querySelector('.stock-row');
    if(row){ row.style.transition='transform .25s cubic-bezier(.22,.8,.28,1)'; row.style.transform='translateX(0)'; }
    openSwipeRow = null;
  }
}

function performSwipeDelete(wrap, row){
  const id = wrap.dataset.ingId;
  const wrapHeight = wrap.getBoundingClientRect().height;
  row.style.transition = 'transform .28s cubic-bezier(.4,0,.2,1)';
  row.style.transform = 'translateX(-100%)';
  wrap.style.maxHeight = wrapHeight+'px';
  wrap.style.overflow = 'hidden';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wrap.style.transition = 'max-height .25s ease .05s, opacity .25s ease .05s';
      wrap.style.maxHeight = '0px';
      wrap.style.opacity = '0';
    });
  });
  if(openSwipeRow===wrap) openSwipeRow=null;
  setTimeout(()=>{
    inventory = inventory.filter(i=>i.id!==id);
    saveState();
    render();
  }, 300);
}

function attachSwipeHandlers(){
  const REVEAL = 76; // ancho visible del botón de borrar cuando queda "abierto"
  const DELETE_FRACTION = 0.55; // % del ancho de la fila para que soltar dispare el borrado automático
  document.querySelectorAll('.stock-row-swipe').forEach(wrap=>{
    const row = wrap.querySelector('.stock-row');
    const delBg = wrap.querySelector('.stock-row-delete-bg');
    const delBtn = wrap.querySelector('.stock-row-delete-btn');
    if(!row) return;
    let startX=0, startY=0, dx=0, dragging=false, axis=null, baseX=0, rowWidth=0;

    row.addEventListener('pointerdown',(e)=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      if(openSwipeRow && openSwipeRow!==wrap) closeOpenSwipe();
      baseX = (wrap===openSwipeRow) ? -REVEAL : 0;
      startX=e.clientX; startY=e.clientY; dx=baseX; dragging=true; axis=null;
      rowWidth = wrap.getBoundingClientRect().width;
      row.style.transition='none';
      try{ row.setPointerCapture(e.pointerId); }catch(err){}
    });

    row.addEventListener('pointermove',(e)=>{
      if(!dragging) return;
      const rawDx = e.clientX-startX;
      const rawDy = e.clientY-startY;
      if(axis===null){
        if(Math.abs(rawDx)<6 && Math.abs(rawDy)<6) return;
        axis = Math.abs(rawDx)>Math.abs(rawDy) ? 'x' : 'y';
        if(axis==='y'){ dragging=false; row.style.transition=''; return; }
      }
      if(axis!=='x') return;
      e.preventDefault();
      let next = baseX + rawDx;
      if(next>0) next = next*0.25; // resistencia tipo goma al tirar hacia la derecha del todo
      if(next < -REVEAL){
        const over = next + REVEAL;
        next = -REVEAL + over*0.4; // resistencia progresiva pasado el punto de "abierto"
      }
      const maxNeg = -(rowWidth*0.9);
      if(next < maxNeg) next = maxNeg;
      dx = next;
      row.style.transform = `translateX(${next}px)`;
      if(delBg){
        const progress = Math.min(1, Math.max(0, Math.abs(next))/(rowWidth*DELETE_FRACTION));
        delBg.style.opacity = String(0.7 + progress*0.3);
      }
    });

    const endDrag = ()=>{
      if(!dragging) return;
      dragging=false;
      if(axis!=='x'){ row.style.transition=''; return; }
      row.style.transition = 'transform .22s cubic-bezier(.22,.8,.28,1)';
      if(Math.abs(dx) > rowWidth*DELETE_FRACTION){
        performSwipeDelete(wrap, row);
      } else if(dx < -REVEAL*0.4){
        row.style.transform = `translateX(${-REVEAL}px)`;
        openSwipeRow = wrap;
      } else {
        row.style.transform = 'translateX(0)';
        if(openSwipeRow===wrap) openSwipeRow=null;
      }
    };
    row.addEventListener('pointerup', endDrag);
    row.addEventListener('pointercancel', endDrag);

    row.addEventListener('click',(e)=>{
      if(openSwipeRow===wrap){ e.preventDefault(); e.stopPropagation(); closeOpenSwipe(); }
    });

    if(delBtn) delBtn.onclick=(e)=>{ e.stopPropagation(); performSwipeDelete(wrap, row); };
  });
}

/* ================= EVENTOS ================= */
function attachEvents(){
  attachSwipeHandlers();
  document.querySelectorAll('.bottom-nav-item').forEach(t=>{ t.onclick=()=>{ activeTab=t.dataset.tab; render(); }; });
  const btnLangToggle=document.getElementById('btn-lang-toggle');
  if(btnLangToggle) btnLangToggle.onclick=()=>setLang(uiLang==='es'?'en':'es');

  const btnOpenMonthlySpend = document.getElementById('btn-open-monthly-spend');
  if(btnOpenMonthlySpend) btnOpenMonthlySpend.onclick = openMonthlySpendModal;
  const monthlySpendOverlay = document.getElementById('monthly-spend-overlay');
  if(monthlySpendOverlay){
    monthlySpendOverlay.addEventListener('mousedown',(e)=>{ if(e.target===monthlySpendOverlay) closeMonthlySpendModal(); });
    const closeMonthlySpendBtn = document.getElementById('btn-close-monthly-spend');
    if(closeMonthlySpendBtn) closeMonthlySpendBtn.onclick = closeMonthlySpendModal;
  }

  const btnNewItem=document.getElementById('btn-new-item'); if(btnNewItem) btnNewItem.onclick=()=>openItemModal(null);
  const btnNewPurchase=document.getElementById('btn-new-purchase'); if(btnNewPurchase) btnNewPurchase.onclick=()=>openPurchaseModal();
  const btnAlertSettings=document.getElementById('btn-alert-settings');
  if(btnAlertSettings) btnAlertSettings.onclick=()=>{
    draftThreshold=priceAlertThreshold;
    showAlertSettingsModal=true; render();
  };

  const alertSettingsOverlay=document.getElementById('alert-settings-overlay');
  if(alertSettingsOverlay){
    alertSettingsOverlay.addEventListener('mousedown',(e)=>{ if(e.target===alertSettingsOverlay){ showAlertSettingsModal=false; render(); } });
    const cancelAlertBtn=document.getElementById('btn-cancel-alert-settings');
    if(cancelAlertBtn) cancelAlertBtn.onclick=()=>{ showAlertSettingsModal=false; render(); };
    const saveAlertBtn=document.getElementById('btn-save-alert-settings');
    if(saveAlertBtn) saveAlertBtn.onclick=()=>{
      const val=parseFloat(document.getElementById('alert-threshold-input').value);
      if(val>0) priceAlertThreshold=val;
      saveState();
      showAlertSettingsModal=false; render();
    };
  }

  const btnSuggestedOrder=document.getElementById('btn-suggested-order');
  if(btnSuggestedOrder) btnSuggestedOrder.onclick=()=>{ showSuggestedOrderModal=true; render(); };
  const suggestedOrderOverlay=document.getElementById('suggested-order-overlay');
  if(suggestedOrderOverlay){
    suggestedOrderOverlay.addEventListener('mousedown',(e)=>{ if(e.target===suggestedOrderOverlay){ showSuggestedOrderModal=false; render(); } });
    const closeSuggestedBtn=document.getElementById('btn-close-suggested-order');
    if(closeSuggestedBtn) closeSuggestedBtn.onclick=()=>{ showSuggestedOrderModal=false; render(); };
  }

  const btnCycleCount=document.getElementById('btn-cycle-count');
  if(btnCycleCount) btnCycleCount.onclick=openCycleCountModal;
  const ccBanner=document.getElementById('cc-banner');
  if(ccBanner) ccBanner.onclick=openCycleCountModal;
  const cycleCountOverlay=document.getElementById('cycle-count-overlay');
  if(cycleCountOverlay){
    cycleCountOverlay.addEventListener('mousedown',(e)=>{ if(e.target===cycleCountOverlay) closeCycleCountModal(); });
    const cancelCcBtn=document.getElementById('btn-close-cycle-count');
    if(cancelCcBtn) cancelCcBtn.onclick=closeCycleCountModal;
    const saveCcBtn=document.getElementById('btn-save-cycle-count');
    if(saveCcBtn) saveCcBtn.onclick=()=>{
      const pct=parseFloat(document.getElementById('cc-pct-input').value);
      const interval=parseFloat(document.getElementById('cc-interval-input').value);
      if(pct>0 && pct<=100) cycleCountPct=pct;
      if(interval>0) cycleCountIntervalDays=interval;

      if(isCycleCountDue()){
        const batch=cycleCountBatch();
        document.querySelectorAll('[data-cc-count]').forEach(inp=>{
          const val=parseFloat(inp.value);
          if(!isNaN(val) && val>=0){
            const ing=inventory.find(i=>i.id===inp.dataset.ccCount);
            if(ing) ing.qtyOnHand=val;
          }
        });
        cycleCountLastDate=localDateStr();
        cycleCountCursor=(cycleCountCursor+batch.length)%Math.max(inventory.length,1);
      }
      saveState();
      closeCycleCountModal();
    };
  }

  const btnScanFab=document.getElementById('btn-scan-fab');
  if(btnScanFab) btnScanFab.onclick=openScanModal;

  document.querySelectorAll('[data-view-receipt]').forEach(card=>{
    card.onclick=()=>{ showReceiptDetail=card.dataset.viewReceipt; render(); };
  });
  const receiptDetailOverlay=document.getElementById('receipt-detail-overlay');
  if(receiptDetailOverlay){
    receiptDetailOverlay.addEventListener('mousedown',(e)=>{ if(e.target===receiptDetailOverlay){ showReceiptDetail=null; render(); } });
    const closeBtn=document.getElementById('btn-close-receipt-detail');
    if(closeBtn) closeBtn.onclick=()=>{ showReceiptDetail=null; render(); };
    const currentReceipt = receipts.find(x=>x.id===showReceiptDetail);
    const deleteBtn=document.getElementById('btn-delete-receipt');
    if(deleteBtn && currentReceipt) deleteBtn.onclick=()=>deleteReceipt(currentReceipt.id);
    const printBtn=document.getElementById('btn-print-receipt');
    if(printBtn && currentReceipt) printBtn.onclick=()=>printReceipt(currentReceipt);
    const shareBtn=document.getElementById('btn-share-receipt');
    if(shareBtn && currentReceipt) shareBtn.onclick=()=>shareReceipt(currentReceipt);
  }

  const btnScanFromReceipts=document.getElementById('btn-scan-from-receipts');
  if(btnScanFromReceipts) btnScanFromReceipts.onclick=openScanModal;
  const receiptSearchInp=document.getElementById('receipt-search');
  if(receiptSearchInp) receiptSearchInp.oninput=(e)=>{
    // render() reemplaza el innerHTML entero (recrea el <input>), así que sin esto
    // el cursor/foco se perdería en cada letra que se escribe en la búsqueda
    const cursorPos = e.target.selectionStart;
    receiptSearchQuery = e.target.value;
    render();
    const freshInp = document.getElementById('receipt-search');
    if(freshInp){ freshInp.focus(); freshInp.setSelectionRange(cursorPos, cursorPos); }
  };

  document.querySelectorAll('[data-history-item]').forEach(b=>{ b.onclick=()=>openPriceHistoryModal(b.dataset.historyItem); });
  const priceHistoryOverlay=document.getElementById('price-history-overlay');
  if(priceHistoryOverlay){
    priceHistoryOverlay.addEventListener('mousedown',(e)=>{ if(e.target===priceHistoryOverlay) closePriceHistoryModal(); });
    const closeHistoryBtn=document.getElementById('btn-close-price-history');
    if(closeHistoryBtn) closeHistoryBtn.onclick=closePriceHistoryModal;
  }

  document.querySelectorAll('[data-edit-item]').forEach(b=>{ b.onclick=()=>openItemModal(inventory.find(i=>i.id===b.dataset.editItem)); });
  document.querySelectorAll('[data-del-item]').forEach(b=>{ b.onclick=()=>{ inventory=inventory.filter(i=>i.id!==b.dataset.delItem); saveState(); render(); }; });

  /* Modal ingrediente */
  const itemOverlay=document.getElementById('item-overlay');
  if(itemOverlay){
    itemOverlay.addEventListener('mousedown',(e)=>{ if(e.target===itemOverlay) closeItemModal(); });
    document.getElementById('btn-cancel-item').onclick=closeItemModal;
    document.getElementById('btn-save-item').onclick=()=>{
      const name=document.getElementById('fi-name').value.trim();
      if(!name) return;
      const item={
        id:draftItem.id, name,
        unit:document.getElementById('fi-unit').value,
        costPerUnit:parseFloat(document.getElementById('fi-cost').value)||0,
        updated:draftItem.updated||false,
        qtyOnHand:parseFloat(document.getElementById('fi-stock').value)||0
      };
      if(editingItem){ const idx=inventory.findIndex(i=>i.id===editingItem); inventory[idx]=item; }
      else inventory.push(item);
      saveState();
      closeItemModal();
    };
  }

  /* Modal compra manual */
  const purchaseOverlay=document.getElementById('purchase-overlay');
  if(purchaseOverlay){
    purchaseOverlay.addEventListener('mousedown',(e)=>{ if(e.target===purchaseOverlay) closePurchaseModal(); });
    document.getElementById('btn-cancel-purchase').onclick=closePurchaseModal;
    document.getElementById('btn-save-purchase').onclick=()=>{
      const ingId=document.getElementById('pf-ing').value;
      const qty=parseFloat(document.getElementById('pf-qty').value);
      const totalPrice=parseFloat(document.getElementById('pf-price').value);
      const supplier=document.getElementById('pf-supplier').value.trim()||t('fallback_unspecified');
      const date=document.getElementById('pf-date').value;
      if(!ingId||!qty||!totalPrice) return;
      purchases.push({id:uid('p'), ingId, qty, totalPrice, supplier, date});
      const ing=inventory.find(i=>i.id===ingId);
      if(ing){ ing.costPerUnit=totalPrice/qty; ing.updated=true; ing.qtyOnHand=(ing.qtyOnHand||0)+qty; }
      saveState();
      closePurchaseModal();
    };
  }

  /* Modal escaneo de recibo */
  const scanOverlay=document.getElementById('scan-overlay');
  if(scanOverlay){
    scanOverlay.addEventListener('mousedown',(e)=>{ if(e.target===scanOverlay) closeScanModal(); });
    document.getElementById('btn-cancel-scan').onclick=closeScanModal;

    const dz=document.getElementById('drop-zone');
    const fileInput=document.getElementById('receipt-file');
    if(fileInput){
      fileInput.onchange=(e)=>{
        const f=e.target.files[0];
        fileInput.value=''; // permite volver a elegir el mismo archivo para otra página si hace falta
        if(f) addScanPage(f);
      };
    }
    if(dz) dz.onclick=()=>fileInput.click();
    const addPageBtn=document.getElementById('btn-add-scan-page');
    if(addPageBtn) addPageBtn.onclick=()=>fileInput.click();
    const processBtn=document.getElementById('btn-process-scan');
    if(processBtn) processBtn.onclick=()=>processReceiptImage();
    document.querySelectorAll('[data-remove-scan-page]').forEach(b=>{
      b.onclick=()=>{ scanImages.splice(parseInt(b.dataset.removeScanPage),1); render(); };
    });

    const retryBtn=document.getElementById('btn-retry-scan');
    if(retryBtn) retryBtn.onclick=()=>{ scanState='idle'; render(); };
    const fallbackBtn=document.getElementById('btn-fallback-manual');
    if(fallbackBtn) fallbackBtn.onclick=()=>{ closeScanModal(); openPurchaseModal(); };

    document.querySelectorAll('[data-scan-name]').forEach(inp=>{
      inp.onchange=()=>{ scanExtracted[parseInt(inp.dataset.scanName)].rawName=inp.value; render(); };
    });
    document.querySelectorAll('[data-scan-match]').forEach(sel=>{
      sel.onchange=()=>{ scanExtracted[parseInt(sel.dataset.scanMatch)].matchedIngId=sel.value; render(); };
    });
    document.querySelectorAll('[data-scan-qty]').forEach(inp=>{
      inp.onchange=()=>{ const it=scanExtracted[parseInt(inp.dataset.scanQty)]; it.qty=parseFloat(inp.value)||0; it.qtyVerified=true; render(); };
    });
    document.querySelectorAll('[data-scan-price]').forEach(inp=>{
      inp.onchange=()=>{ scanExtracted[parseInt(inp.dataset.scanPrice)].totalPrice=parseFloat(inp.value)||0; render(); };
    });
    document.querySelectorAll('[data-remove-scan-item]').forEach(b=>{
      b.onclick=()=>{ scanExtracted.splice(parseInt(b.dataset.removeScanItem),1); render(); };
    });
    const addScanItemBtn=document.getElementById('btn-add-scan-item');
    if(addScanItemBtn) addScanItemBtn.onclick=()=>{
      scanExtracted.push({rawName:'', qty:1, totalPrice:0, unit:'unidad', matchedIngId:'__new__', qtyVerified:true});
      render();
    };

    const supplierInp=document.getElementById('scan-supplier');
    if(supplierInp) supplierInp.oninput=(e)=>scanSupplier=e.target.value;
    const dateInp=document.getElementById('scan-date');
    if(dateInp) dateInp.oninput=(e)=>scanDate=e.target.value;
    const invoiceTotalInp=document.getElementById('scan-invoice-total');
    if(invoiceTotalInp) invoiceTotalInp.oninput=(e)=>scanInvoiceTotal=parseFloat(e.target.value)||null;
    const dupCheck=document.getElementById('scan-dup-confirm');
    if(dupCheck) dupCheck.onchange=(e)=>{ scanDuplicateConfirmed=e.target.checked; render(); };

    const applyBtn=document.getElementById('btn-apply-scan');
    if(applyBtn) applyBtn.onclick=applyScanResults;
  }
}

function closeItemModal(){ showItemModal=false; editingItem=null; draftItem=null; render(); }
function closePurchaseModal(){ showPurchaseModal=false; render(); }

loadState();
render();
</script>
