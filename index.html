<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlatoCost — Inventario &amp; Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1F3F4; --panel:#FFFFFF; --ink:#202124; --ink-soft:#5F6368; --line:#DADCE0;
    /* Paleta bandera de Italia: verde y rojo bandiera como acentos, blanco/gris neutro para superficies y texto */
    --navy:#008C45; --navy-soft:#2FAE68; --tomato:#CD212A; --saffron:#D9605A; --basil:#008C45;
    --basil-soft:#E3F3E9; --tomato-soft:#FBE4E4; --saffron-soft:#FCEBE9;
    --radius:14px; --shadow:0 1px 2px rgba(32,33,36,0.08), 0 8px 24px rgba(32,33,36,0.08);
  }
  *{box-sizing:border-box;}
  html{touch-action:manipulation;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  .view-container{}
  .view-container.view-anim{animation:viewFadeIn .65s cubic-bezier(0.22,1,0.36,1);}
  @keyframes viewFadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .topbar .brand{order:1;}
  .topbar .tabs{order:2;}
  .topbar .lang-toggle{order:3;}
  .brand{display:flex;align-items:center;gap:2px;}
  .brand-mark{
    width:42px;height:42px;border-radius:11px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.10) 0 5px, transparent 5px 10px),
      linear-gradient(145deg,#2FAE68,var(--navy));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:25px;box-shadow:var(--shadow);
  }
  .brand-name{font-size:20px;font-weight:700;}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  .tabs{display:flex;gap:6px;background:#E8E5DC;padding:5px;border-radius:12px;flex-wrap:wrap;}
  .tab{padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);border:none;background:transparent;transition:all .4s ease;white-space:nowrap;}
  .tab.active{background:var(--navy);color:#fff;}
  .tab:not(.active):hover{color:var(--ink);}

  .lang-toggle{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);flex-shrink:0;transition:transform .2s ease, border-color .2s ease, color .2s ease;}
  .lang-toggle:hover{border-color:var(--navy);color:var(--navy);}
  .lang-toggle:active{transform:scale(0.92);}

  .scan-card{cursor:pointer;}
  .scan-fab-mini{width:52px;height:52px;flex-shrink:0;position:relative;transition:transform .25s ease;}
  .scan-fab-mini-lg{width:76px;height:76px;}
  .scan-card:hover .scan-fab-mini{transform:scale(1.07);}
  .scan-card:active .scan-fab-mini{transform:scale(0.94);}
  .scan-fab-mini svg{position:relative;z-index:2;width:100%;height:100%;filter:drop-shadow(0 2px 5px rgba(32,33,36,0.25));}
  .scan-fab-ring{
    position:absolute;inset:0;border-radius:50%;background:rgba(205,33,42,0.35);
    animation:fabPulse 1.8s cubic-bezier(0.3,0.6,0.4,1) infinite; z-index:1;
  }
  .scan-fab-ring.delay{animation-delay:.6s;}
  @keyframes fabPulse{
    0%{transform:scale(1);opacity:.65;}
    100%{transform:scale(1.9);opacity:0;}
  }

  /* NAVEGADOR DE MES (tarjeta de gasto) */
  .month-nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .month-nav-btn{
    width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
    background:linear-gradient(145deg,#2FAE68,var(--navy));color:#fff;
    font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(66,133,244,0.35);
    transition:transform .15s ease, opacity .2s ease;
    position:relative;
  }
  .month-nav-btn:disabled{opacity:.25;cursor:not-allowed;box-shadow:none;}
  .month-nav-btn:not(:disabled):hover{transform:scale(1.1);}
  .month-nav-btn:not(:disabled):active{transform:scale(0.88);}
  .month-nav-btn.pop{animation:navPop .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes navPop{
    0%{transform:scale(1) rotate(0deg);}
    35%{transform:scale(0.78) rotate(var(--pop-rot,-14deg));}
    70%{transform:scale(1.22) rotate(calc(var(--pop-rot,-14deg) * -0.4));}
    100%{transform:scale(1) rotate(0deg);}
  }
  .month-nav-ring{
    position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--navy-soft);
    opacity:0;pointer-events:none;
  }
  .month-nav-ring.burst{animation:navRingBurst .55s ease-out;}
  @keyframes navRingBurst{
    0%{opacity:.85;transform:scale(1);}
    100%{opacity:0;transform:scale(2.1);}
  }
  .stat-flip-wrap{perspective:600px;}
  .stat-flip{transform-style:preserve-3d;transform-origin:bottom center;}
  .stat-flip.playing{animation:statFlip .8s cubic-bezier(0.22,1,0.36,1);}
  @keyframes statFlip{
    0%{transform:rotateX(-90deg);opacity:0;}
    55%{transform:rotateX(12deg);opacity:1;}
    100%{transform:rotateX(0deg);opacity:1;}
  }
  .month-compare{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
  .month-compare .link-btn{font-size:11px;padding:0;margin-left:6px;}

  .grid-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--panel);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line);}
  .stat-label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .stat-value{font-size:26px;font-weight:700;margin-top:6px;font-family:'Space Grotesk';}
  .stat-value.tomato{color:var(--tomato);} .stat-value.basil{color:var(--basil);} .stat-value.navy{color:var(--navy);} .stat-value.saffron{color:var(--saffron);}
  .stat-hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;margin:0;}
  .section-head p{font-size:13px;color:var(--ink-soft);margin:2px 0 0;}

  .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;transition:transform .25s ease, opacity .3s ease, background .3s ease;font-family:'Inter';}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-soft);}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}

  .alert-banner{background:var(--tomato-soft);border:1px solid #EBC2B8;border-radius:12px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px;color:#8C3A29;font-size:13.5px;font-weight:600;}
  .alert-banner .count{background:var(--tomato);color:#fff;border-radius:20px;padding:2px 9px;font-size:12px;}

  .table-wrap{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin-bottom:26px;}
  .table-wrap.scroll-list{max-height:340px;overflow-y:auto;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:12px 16px;background:#FAFAF7;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.mono-cell{font-family:'IBM Plex Mono';}
  .cell-sub{display:none;}

  .price-updated{display:inline-block;background:var(--basil-soft);color:var(--basil);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}

  .link-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:12.5px;cursor:pointer;padding:4px 6px;}
  .link-btn:hover{text-decoration:underline;}
  .link-btn.danger{color:var(--tomato);}


  /* DISH CARDS */
  .dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .dish-card{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
  .dish-top{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .dish-name{font-size:16px;font-weight:700;font-family:'Space Grotesk';}
  .dish-cat{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .gauge{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'IBM Plex Mono';font-weight:600;font-size:13px;}
  .dish-mid{padding:0 18px;display:flex;gap:18px;margin-bottom:12px;}
  .metric{flex:1;}
  .metric-label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .metric-value{font-size:16px;font-weight:700;font-family:'IBM Plex Mono';margin-top:2px;}
  .dish-status{margin:0 18px 14px;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:600;}
  .dish-actions{margin-top:auto;border-top:1px solid var(--line);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;background:#FAFAF7;}
  .recipe-list{padding:0 18px 12px;display:flex;flex-direction:column;gap:6px;}
  .recipe-item{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);}
  .recipe-item span:last-child{font-family:'IBM Plex Mono';color:var(--ink);}

  .margin-compare{
    margin:0 18px 12px;padding:10px 12px;background:#FAFAF7;border:1px solid var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .mc-col{flex:1;text-align:center;}
  .mc-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;}
  .mc-value{font-family:'IBM Plex Mono';font-weight:700;font-size:13.5px;margin-top:2px;}
  .mc-pct{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .mc-arrow{font-size:13px;font-weight:700;flex-shrink:0;}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(30,36,34,0.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-height:88vh;overflow-y:auto;}
  .modal.wide{max-width:600px;}
  .modal h3{margin:0 0 4px;font-size:18px;}
  .modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:'Inter';background:#FAFAF9;}
  .field input:focus,.field select:focus{outline:2px solid var(--navy-soft);border-color:var(--navy);background:#fff;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn{flex:1;}
  .helper-note{font-size:11.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px;}

  .add-ing-row{display:flex;gap:8px;align-items:flex-end;background:#FAFAF7;padding:12px;border-radius:10px;margin-bottom:12px;border:1px dashed var(--line);}
  .add-ing-row .field{margin-bottom:0;flex:1;}
  .ing-list-mini{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:180px;overflow-y:auto;}
  .ing-list-mini-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 10px;background:#FAFAF7;border-radius:8px;}
  .remove-x{background:none;border:none;color:var(--tomato);cursor:pointer;font-size:15px;padding:0 4px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .em-icon{font-size:34px;margin-bottom:10px;}

  /* PIN GATE */
  .pin-gate{max-width:300px;margin:50px auto 0;text-align:center;}
  .pin-gate .pin-icon{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;}
  .pin-gate h2{font-size:18px;margin:0 0 4px;}
  .pin-gate p{font-size:12.5px;color:var(--ink-soft);margin:0 0 22px;}
  .pin-dots{display:flex;gap:14px;justify-content:center;margin-bottom:24px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:#fff;transition:all .3s ease;}
  .pin-dot.filled{background:var(--navy);border-color:var(--navy);}
  .pin-dot.error{background:var(--tomato);border-color:var(--tomato);}
  .pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .pin-key{
    aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    font-size:20px;font-weight:700;font-family:'Space Grotesk';color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow);transition:transform .25s ease;
  }
  .pin-key:active{transform:scale(0.92);background:#F0EEE7;}
  .pin-key.empty{visibility:hidden;}
  .pin-key.backspace{font-size:16px;color:var(--tomato);}
  .pin-error-msg{color:var(--tomato);font-size:12px;font-weight:600;margin-top:16px;min-height:16px;}

  .purchase-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);}
  .purchase-row:last-child{border-bottom:none;}
  .purchase-left{display:flex;flex-direction:column;}
  .purchase-name{font-weight:600;font-size:13.5px;}
  .purchase-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .purchase-amount{font-family:'IBM Plex Mono';font-weight:700;color:var(--navy);}

  /* RECEIPT SCAN */
  .drop-zone{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:#FAFAF7;margin-bottom:16px;}
  .drop-zone:hover{border-color:var(--navy);}
  .drop-zone .dz-icon{font-size:28px;margin-bottom:6px;}
  .receipt-preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-bottom:14px;border:1px solid var(--line);}
  .scan-status{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--saffron-soft);border-radius:10px;font-size:13px;font-weight:600;color:#8C3A29;margin-bottom:14px;}
  .spinner{width:16px;height:16px;border:2.5px solid #F0BAB5;border-top-color:#8C3A29;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .scan-error{background:var(--tomato-soft);color:#8C3A29;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px;}

  .matched-item{background:#FAFAF7;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .matched-item .mi-top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .matched-item .mi-top strong{color:var(--ink);font-size:13px;}
  .mi-fields{display:flex;gap:8px;}
  .mi-fields select, .mi-fields input{padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;}

  @media (max-width:720px){
    #app{padding:16px 14px 70px;}
    .topbar{margin-bottom:16px;row-gap:10px;}
    .topbar .lang-toggle{order:2;}
    .topbar .tabs{order:3;}
    .tabs{width:100%;}
    .tab{flex:1;text-align:center;}
    .table-wrap{overflow-x:auto;}
    .mi-fields{flex-direction:column;}
    .field-row{flex-wrap:wrap;}
    .dish-grid{grid-template-columns:1fr;}
    .modal{padding:20px;}
    .modal-actions{flex-wrap:wrap;}
  }

  @media (max-width:520px){
    .grid-summary{grid-template-columns:1fr;gap:10px;margin-bottom:16px;}
    .month-nav-head{flex-wrap:wrap;row-gap:8px;}
    .stat-label{white-space:normal;}
    .scan-card{padding:6px 0;}

    /* Tabla de inventario: en vez de forzar scroll horizontal, se esconde la columna
       Categoría (se muestra como subtítulo bajo el nombre) y la de Unidad (ya va
       incluida en "Costo/unidad"), y las acciones se apilan si no entran en una línea. */
    table{table-layout:fixed;}
    th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3){display:none;}
    th, td{padding:10px 8px;font-size:12.5px;}
    td:last-child{white-space:normal;}
    .cell-sub{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px;}
    .link-btn{padding:4px 5px;font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= ESTADO INICIAL ================= */
let inventory = [
  {id:'i1', name:'Chicken breast', category:'Proteins', unit:'lb', costPerUnit:2.125, updated:false},
  {id:'i2', name:'Medium shrimp', category:'Proteins', unit:'lb', costPerUnit:8.50, updated:false},
  {id:'i3', name:'Mozzarella cheese', category:'Dairy', unit:'lb', costPerUnit:3.80, updated:false},
  {id:'i4', name:'Tomato', category:'Vegetables', unit:'lb', costPerUnit:0.90, updated:false},
  {id:'i5', name:'Olive oil', category:'Pantry', unit:'oz', costPerUnit:0.1875, updated:false},
  {id:'i6', name:'Flour', category:'Pantry', unit:'lb', costPerUnit:0.56, updated:false},
  {id:'i7', name:'Flour tortilla', category:'Pantry', unit:'unidad', costPerUnit:0.30, updated:false},
];

let purchases = [
  {id:'p1', ingId:'i1', qty:40, totalPrice:85.00, supplier:'US Foods', date:'2026-08-01'},
  {id:'p2', ingId:'i2', qty:5, totalPrice:42.50, supplier:'Gulf Seafood Co.', date:'2026-07-30'},
  {id:'p3', ingId:'i4', qty:25, totalPrice:22.50, supplier:'Mercado Local', date:'2026-07-29'},
  {id:'p4', ingId:'i6', qty:25, totalPrice:14.00, supplier:'Sysco', date:'2026-07-12'},
  {id:'p5', ingId:'i3', qty:10, totalPrice:38.00, supplier:'Sysco', date:'2026-06-20'},
  {id:'p6', ingId:'i1', qty:40, totalPrice:82.00, supplier:'US Foods', date:'2026-06-05'},
];

let dishes = [
  {id:'d1', name:'Shrimp Tacos (3pc)', category:'Entrees', price:14.50, items:[{ingId:'i2', qty:0.35},{ingId:'i7', qty:3},{ingId:'i4', qty:0.2}]},
  {id:'d2', name:'Grilled Chicken Breast', category:'Entrees', price:16.00, items:[{ingId:'i1', qty:0.55},{ingId:'i5', qty:0.5}]},
  {id:'d3', name:'Margherita Pizza 12"', category:'Pizzas', price:13.00, items:[{ingId:'i6', qty:0.4},{ingId:'i3', qty:0.5},{ingId:'i4', qty:0.3},{ingId:'i5', qty:0.3}]},
];

let receipts = []; // historial: {id, imageBase64, mediaType, supplier, date, total, itemCount, appliedItems, createdAt, purchaseIds}
let aliasMap = {}; // nombre normalizado del recibo -> ingredienteId, aprendido de correcciones previas
let receiptSearchQuery = '';

let activeTab = 'dashboard';
let lastRenderedTab = null;
let selectedStatMonth = null; // 'YYYY-MM' o null = mes actual, para el navegador de meses del dashboard
let lastStatMonthRendered = null; // para saber si animar el "flip" al cambiar de mes
let showItemModal=false, showPurchaseModal=false, showDishModal=false, showScanModal=false, showReceiptDetail=null;
let showPriceHistoryModal=false, priceHistoryIngId=null;
let showMonthlySpendModal=false;
let editingItem=null, editingDish=null;
let draftItem=null, draftDish=null;
let scanDuplicateOf=null; // receipt existente si se detecta posible duplicado
let scanDuplicateConfirmed=false;

// PIN del gerente, guardado como hash SHA-256 (no en texto plano) para que no se lea directo
// desde "ver código fuente". Esto sube la barrera casual pero NO es seguridad real: al ser
// una app sin backend, cualquiera con conocimientos técnicos podría igual probar combinaciones
// contra este hash. No guardes aquí nada que de verdad necesite protección fuerte.
// Hash de '1234' (PIN de fábrica) — para cambiarlo, generá el SHA-256 del PIN nuevo y pegalo aquí.
const MENU_PIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
async function checkPin(pin){
  const bytes = new TextEncoder().encode(pin);
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('') === MENU_PIN_HASH;
}

/* ================= UTILIDADES ================= */
function uid(p){return p+Math.random().toString(36).slice(2,9);}
function money(n){return '$'+(isNaN(n)?'0.00':n.toFixed(2));}
/* Fecha/mes de "hoy" en hora LOCAL — a diferencia de toISOString() (que da la fecha en UTC),
   esto evita que a alguien en América se le adelante un día al escanear o registrar de noche. */
function localDateStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localMonthStr(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ================= PERSISTENCIA (localStorage) ================= */
const STORAGE_KEY = 'platocost_data_v1';
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      inventory, purchases, dishes, receipts, aliasMap, priceAlertThreshold
    }));
  }catch(e){
    console.warn('No se pudo guardar en localStorage (¿espacio lleno?)', e);
  }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(Array.isArray(data.inventory)) inventory = data.inventory;
    if(Array.isArray(data.purchases)) purchases = data.purchases;
    if(Array.isArray(data.dishes)) dishes = data.dishes;
    if(Array.isArray(data.receipts)) receipts = data.receipts;
    if(data.aliasMap && typeof data.aliasMap==='object') aliasMap = data.aliasMap;
    if(typeof data.priceAlertThreshold==='number') priceAlertThreshold = data.priceAlertThreshold;
  }catch(e){
    console.warn('No se pudo leer localStorage', e);
  }
}
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
const MONTH_NAMES = {
  es: ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
};
function monthLabel(key){
  const [y,m] = key.split('-');
  return MONTH_NAMES[uiLang][parseInt(m,10)-1]+' '+y;
}
function unitCost(ing){ return ing.costPerUnit; }
function dishCost(dish){
  return dish.items.reduce((sum,it)=>{
    const ing = inventory.find(i=>i.id===it.ingId);
    return ing ? sum + unitCost(ing)*it.qty : sum;
  },0);
}
function foodCostPct(dish){
  const c = dishCost(dish);
  return dish.price>0 ? (c/dish.price)*100 : 0;
}
/* Reconstruye el costo de un ingrediente "a la fecha X" usando el historial real de compras */
function costAsOfDate(ingId, dateStr){
  const relevant = purchases
    .filter(p=>p.ingId===ingId && p.date<=dateStr && p.qty>0)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(relevant.length>0) return relevant[0].totalPrice/relevant[0].qty;
  const ing = inventory.find(i=>i.id===ingId);
  return ing ? ing.costPerUnit : 0;
}
function dishCostAsOf(dish, dateStr){
  return dish.items.reduce((sum,it)=> sum + costAsOfDate(it.ingId, dateStr)*it.qty, 0);
}
/* % de cambio del costo del ingrediente vs. su compra anterior (las 2 últimas compras registradas) */
function lastPriceChangePct(ingId){
  const relevant = purchases
    .filter(p=>p.ingId===ingId && p.qty>0)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(relevant.length<2) return null;
  const latest = relevant[0].totalPrice/relevant[0].qty;
  const prev = relevant[1].totalPrice/relevant[1].qty;
  if(prev<=0) return null;
  return ((latest-prev)/prev)*100;
}
function priceChangeBadge(pct){
  if(pct===null) return '';
  const up = pct>0.5, down = pct<-0.5;
  const color = up?'var(--tomato)':down?'var(--basil)':'var(--ink-soft)';
  const arrow = up?'▲':down?'▼':'→';
  return `<span style="color:${color};font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap;">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
}
function lastMonthEndDate(){
  const now = new Date();
  const lastDayPrevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
  return localDateStr(lastDayPrevMonth);
}
function marginComparison(dish){
  const costNow = dishCost(dish);
  const costLastMonth = dishCostAsOf(dish, lastMonthEndDate());
  const marginNow = dish.price - costNow;
  const marginLastMonth = dish.price - costLastMonth;
  const marginPctNow = dish.price>0 ? (marginNow/dish.price)*100 : 0;
  const marginPctLastMonth = dish.price>0 ? (marginLastMonth/dish.price)*100 : 0;
  return {costNow, costLastMonth, marginNow, marginLastMonth, marginPctNow, marginPctLastMonth, delta: marginNow-marginLastMonth};
}
function statusOf(pct){
  if(pct<=30) return {label:t('status_profitable'), color:'var(--basil)', bg:'var(--basil-soft)'};
  if(pct<=35) return {label:t('status_borderline'), color:'var(--saffron)', bg:'var(--saffron-soft)'};
  return {label:t('status_low_margin'), color:'var(--tomato)', bg:'var(--tomato-soft)'};
}
function allMonths(){
  const set = new Set(purchases.map(p=>monthKey(p.date)));
  return [...set].sort().reverse();
}
function purchasesForMonth(key){
  return purchases.filter(p=>monthKey(p.date)===key);
}
function spendForMonth(key){
  return purchasesForMonth(key).reduce((s,p)=>s+p.totalPrice,0);
}

  const isViewingCurrent = viewedMonth === currentMonthKey;

  const idx = months.indexOf(viewedMonth);
  const hasOlder = idx>-1 && idx<months.length-1;
  const hasNewer = idx>0;

  const playFlip = viewedMonth !== lastStatMonthRendered;
  lastStatMonthRendered = viewedMonth;

  if(!isViewingCurrent){
    const diff = viewedSpend - currentSpend;
    const pct = currentSpend>0 ? (diff/currentSpend)*100 : (viewedSpend>0 ? 100 : 0);
    const flat = Math.abs(pct)<0.5;

    compareHtml = `<div class="month-compare">${arrow} ${flat?'':Math.abs(pct).toFixed(0)+'% '}${word} ${monthLabel(currentMonthKey)}<button class="link-btn" data-stat-month-reset>${t('dash_back_current')}</button></div>`;
  }

  return `

    <div class="stat-card">

            <span style="position:relative;z-index:2;">›</span><div class="month-nav-ring"></div>

      <div class="stat-flip-wrap">
        <div class="stat-flip ${playFlip?'playing':''}">

/* ---------- RECIBOS (historial) ---------- */
function recibosView(){
  const query = receiptSearchQuery.trim().toLowerCase();
  const filtered = receipts.filter(r=>{
    if(!query) return true;
    const supplierMatch = (r.supplier||'').toLowerCase().includes(query);
    const itemMatch = (r.appliedItems||[]).some(it=>(it.rawName||'').toLowerCase().includes(query));
    return supplierMatch || itemMatch;
  });
  const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));

  // Agrupados por mes (más reciente primero) para que se puedan ubicar rápido en vez
  // de scrollear una sola lista larga, igual que ya se hace con el gasto mensual.
  const groups = [];
  sorted.forEach(r=>{
    const key = monthKey(r.date);
    let g = groups.find(g=>g.key===key);
    if(!g){ g = {key, label: monthLabel(key), receipts: [], total: 0}; groups.push(g); }
    g.receipts.push(r);
    g.total += r.total;
  });

  return `
  <div class="section-head">
    <div><h2>${t('rec_title')}</h2><p>${t('rec_sub')}</p></div>
    <button class="btn btn-primary" id="btn-scan-from-receipts">${t('dash_scan_receipt')}</button>
  </div>
  ${receipts.length>0 ? `<div class="field" style="max-width:340px;"><input id="receipt-search" type="text" value="${escapeHtml(receiptSearchQuery)}" placeholder="${t('rec_search_placeholder')}"></div>` : ''}
  ${receipts.length===0 ? emptyState('🧾',t('empty_receipts_title'),t('empty_receipts_sub')) :
    (sorted.length===0 ? `<div class="helper-note" style="margin:4px 0 0;">${t('rec_no_matches')}</div>` :
    groups.map(g=>`
      <div class="section-head" style="margin-top:22px;margin-bottom:10px;">
        <h3 style="margin:0;font-size:14px;text-transform:capitalize;">${g.label}</h3>
        <div style="font-size:12px;color:var(--ink-soft);">${t('rec_month_total')}: <strong style="color:var(--ink);">${money(g.total)}</strong></div>
      </div>
      <div class="dish-grid">
        ${g.receipts.map(r=>`
          <div class="dish-card" style="cursor:pointer;" data-view-receipt="${r.id}">
            <img src="data:${r.mediaType};base64,${r.imageBase64}" style="width:100%;height:140px;object-fit:cover;">

function openPriceHistoryModal(ingId){ priceHistoryIngId = ingId; showPriceHistoryModal = true; render(); }

function priceHistoryChart(points){
  const W = 560, H = 180, padL = 52, padR = 16, padT = 16, padB = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const prices = points.map(p=>p.unitPrice);
  let min = Math.min(...prices), max = Math.max(...prices);
  if(min===max){ min = min*0.9; max = (max*1.1)||1; } // evita aplanar la gráfica si el precio nunca cambió

  const xFor = (i)=> padL + (points.length===1 ? innerW/2 : (i/(points.length-1))*innerW);
  const yFor = (v)=> padT + innerH - ((v-min)/(max-min))*innerH;

  const first = points[0].unitPrice, last = points[points.length-1].unitPrice;
  const changePct = first>0 ? ((last-first)/first)*100 : 0;
  const trendColor = changePct>3 ? 'var(--tomato)' : changePct<-3 ? 'var(--basil)' : 'var(--navy)';

  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH*f;
    const val = max - (max-min)*f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${money(val)}</text>`;
  }).join('');

  const linePoints = points.map((p,i)=> `${xFor(i).toFixed(1)},${yFor(p.unitPrice).toFixed(1)}`).join(' ');

  const markers = points.map((p,i)=>{
    const x=xFor(i).toFixed(1), y=yFor(p.unitPrice).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="4" fill="${trendColor}" stroke="var(--panel)" stroke-width="2">
      <title>${escapeHtml(p.date)} · ${escapeHtml(p.supplier)} · ${money(p.unitPrice)}</title>
    </circle>`;
  }).join('');

  const lastX = xFor(points.length-1), lastY = yFor(last);
  const endLabel = `<text x="${lastX.toFixed(1)}" y="${(lastY-10).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono">${money(last)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${gridLines}
    <polyline points="${linePoints}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${markers}
    ${endLabel}
  </svg>`;
}

function monthlySpendChart(monthsAsc, currentMonthKey){
  const W = 560, H = 200, padL = 52, padR = 16, padT = 16, padB = 28;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const spends = monthsAsc.map(m=>spendForMonth(m));
  const max = Math.max(...spends, 1);

  const n = monthsAsc.length;
  const slot = innerW / n;
  const barW = Math.min(slot * 0.55, 24);

  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + innerH*(1-f);
    const val = max*f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${money(val)}</text>`;
  }).join('');

  const bars = monthsAsc.map((m,i)=>{
    const spend = spends[i];
    const barH = max>0 ? (spend/max)*innerH : 0;
    const x = padL + i*slot + (slot-barW)/2;
    const y = padT + innerH - barH;
    const isCurrent = m===currentMonthKey;
    const color = isCurrent ? 'var(--navy)' : '#B7C4CC';
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(barH,2).toFixed(1)}" rx="4" fill="${color}">
        <title>${escapeHtml(monthLabel(m))} · ${money(spend)}</title>
      </rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono">${money(spend)}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(padT+innerH+16).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono">${escapeHtml(monthLabel(m))}</text>
    `;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    ${gridLines}
    ${bars}
  </svg>`;
}

function fileToBase64(file){
  // Redimensiona/comprime la foto antes de procesarla — las fotos de celular pesan
  // varios MB y eso hace el OCR lento o puede fallar. Bajamos a un tamaño que se
  // lee bien y carga rápido, y además ocupa menos espacio al guardarse en el historial.
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX_SIDE = 1568;
        let {width, height} = img;
        if(width > MAX_SIDE || height > MAX_SIDE){
          const scale = MAX_SIDE / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve({base64: dataUrl.split(',')[1], mediaType: 'image/jpeg'});
      };
      img.onerror = ()=> reject(new Error(t('err_img_process')));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error(t('err_img_read')));
    reader.readAsDataURL(file);
  });
}

/* Umbral de Otsu: encuentra automáticamente el punto de corte blanco/negro
   que mejor separa el texto del fondo, sin importar cuán clara o sucia esté la foto. */
function otsuThreshold(hist, total){
  let sum = 0;
  for(let t=0;t<256;t++) sum += t*hist[t];
  let sumB=0, wB=0, wF=0, varMax=0, threshold=127;
  for(let t=0;t<256;t++){
    wB += hist[t];
    if(wB===0) continue;
    wF = total - wB;
    if(wF===0) break;
    sumB += t*hist[t];
    const mB = sumB/wB, mF = (sum-sumB)/wF;
    const between = wB*wF*(mB-mF)*(mB-mF);
    if(between>varMax){ varMax=between; threshold=t; }
  }
  return threshold;
}

/* Prepara una versión de la foto optimizada específicamente para lectura OCR:
   más resolución que la copia comprimida que se guarda (ayuda con letra chica),
   en escala de grises y binarizada con Otsu (mejora mucho la lectura en recibos
   con poco contraste, sombras o papel térmico gastado). La foto a color que se
   guarda en el historial no se toca, esto es solo para que Tesseract lea mejor. */
function prepareOcrImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX_SIDE = 2200;
        let {width, height} = img;
        if(width > MAX_SIDE || height > MAX_SIDE){
          const scale = MAX_SIDE / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        try{
          const imgData = ctx.getImageData(0, 0, width, height);
          const d = imgData.data;
          const total = width*height;
          const gray = new Uint8ClampedArray(total);
          const hist = new Array(256).fill(0);
          for(let i=0, p=0; i<d.length; i+=4, p++){
            const g = Math.round(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
            gray[p] = g; hist[g]++;
          }
          const threshold = otsuThreshold(hist, total);
          for(let i=0, p=0; i<d.length; i+=4, p++){
            const v = gray[p] > threshold ? 255 : 0;
            d[i]=v; d[i+1]=v; d[i+2]=v;
          }
          ctx.putImageData(imgData, 0, 0);
        }catch(e){
          // Si el preprocesado falla por lo que sea, seguimos con la imagen a color sin tocar
        }
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=> reject(new Error(t('err_img_process')));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error(t('err_img_read')));
    reader.readAsDataURL(file);
  });
}

/* Carga Tesseract.js (OCR gratis en el navegador) solo la primera vez que se usa,
   igual que el patrón ya usado para OCR de recibos en Nudgy. No requiere API key
   ni backend, así que funciona igual en local, en Netlify o donde sea. */
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = ()=>resolve();
    script.onerror = ()=>{ tesseractLoadPromise=null; reject(new Error(t('err_ocr_load'))); };
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}

/* Convierte "1.234,56" o "1,234.56" a número usando el último separador como decimal */
function normalizeReceiptNumber(str){
  let s = String(str).trim();
  const lastComma = s.lastIndexOf(',');
  const lastDot = s.lastIndexOf('.');
  if(lastComma>-1 && lastDot>-1){
    s = lastComma>lastDot ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(lastComma>-1){
    s = s.replace(',','.');
  }
  return parseFloat(s);
}

/* Líneas que casi seguro NO son un producto (totales, impuestos, encabezados, etc.) */
const RECEIPT_LINE_BLACKLIST = /\btotal\b|\bsubtotal\b|\biva\b|\bimpuesto\b|\btax\b|\bcambio\b|\befectivo\b|\bcash\b|\bchange\b|\bgracias\b|\bthank|\bfactura\b|\binvoice\b|\brecibo\b|\breceipt\b|\bticket\b|\bfecha\b|\bdate\b|tel[eé]fono|\bphone\b|direcci[oó]n|\baddress\b|\bcliente\b|\bcustomer\b|\bcaja\b|\bcashier\b|\batendido\b|art[ií]culo|cant\.|\bqty\b|\bprecio\b|\bprice\b|www\.|http|\bc[oó]digo\b|\bsku\b|descripci[oó]n|\bdescription\b|\bunidad(es)?\b|\bumd\b|p\.?\s?unit|\bimporte\b|\bneto\b|\bbruto\b|\bfolio\b|\borden\b|\border\b|\bpo#|n[°º]\s?\d|\bref(erencia)?\b|\bvendedor\b|\bseller\b|\brfc\b|\bnit\b|\bruc\b|p[aá]gina|page \d|\bfirma\b|\bsignature\b|\bcopia\b|\boriginal\b/i;

/* Parseo heurístico de recibo a partir del texto plano que devuelve el OCR.
   No es tan preciso como una IA que "ve" la imagen — por eso cada producto
   queda editable antes de aplicarse, y se puede agregar uno a mano si el
   OCR no detectó nada. */
function parseReceiptText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);

  let date = '';
  const isoMatch = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  const dmyMatch = text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if(isoMatch){
    date = isoMatch[0];
  } else if(dmyMatch){
    let [, a, b, y] = dmyMatch;
    if(y.length===2) y = '20'+y;
    a = a.padStart(2,'0'); b = b.padStart(2,'0');
    // Los proveedores de este rubro suelen ser distribuidoras de EE.UU. (US Foods, Sysco, etc.),
    // que imprimen la fecha como MM/DD/AAAA — probamos ese orden primero. Si el primer número
    // no puede ser un mes válido (ej. "29/07/2026"), lo tratamos como DD/MM en vez de descartar
    // la fecha del todo.
    if(+a>=1 && +a<=12 && +b>=1 && +b<=31){
      date = `${y}-${a}-${b}`;
    } else if(+b>=1 && +b<=12 && +a>=1 && +a<=31){
      date = `${y}-${b}-${a}`;
    }
  }

  let supplier = '';
  for(const line of lines.slice(0,5)){
    if(/[a-zA-ZñÑáéíóúÁÉÍÓÚ]{3,}/.test(line) && !RECEIPT_LINE_BLACKLIST.test(line) && !/^\d+$/.test(line)){
      const clean = line.replace(/[^\wñÑáéíóúÁÉÍÓÚ\s.&-]/g,'').trim();
      if(clean){ supplier = clean; break; }
    }
  }

  const priceAtEnd = /(\d{1,3}(?:[.,]\d{3})*[.,]\d{2})\s*$/;
  // "2 x Producto", "2x Producto" o "1 @ $1.79" / "1@ $1.79" (el OCR a veces pega el "@" a la
  // cantidad sin espacio, así que "@" no exige espacio detrás como sí lo exige "x")
  const leadingQty = /^(\d{1,3}(?:[.,]\d{1,3})?)\s*(?:[xX@]\s*|\s+)/;
  const bareNumberTok = /^\d+(?:[.,]\d+)?$/;
  // Unidades/palabras de relleno que NO cuentan como "nombre real" cuando decidimos si una
  // línea trae su propio nombre de producto o si es solo la cantidad/precio de la línea anterior
  const UNIT_FILLER_WORDS = new Set(['lb','lbs','kg','kgs','oz','g','gr','ml','l','ea','pc','pcs','unidad','unid','un']);
  function hasRealNameWords(str){
    return str.split(' ').some(tok=>{
      const clean = tok.replace(/[^a-zA-ZñÑáéíóúÁÉÍÓÚ]/g,'');
      return clean.length>=3 && !UNIT_FILLER_WORDS.has(clean.toLowerCase());
    });
  }

  const items = [];
  // Recibos de supermercado suelen traer el nombre del producto en su propia línea y la
  // cantidad/precio en la línea de abajo (ej. "ROMA TOMATOES" / "2.35 lb @ $1.99/lb  $4.68").
  // Guardamos la última línea de texto "con pinta de nombre" para usarla si la siguiente
  // línea con precio resulta ser solo cantidad/unidad, sin nombre propio.
  let pendingName = '';
  for(const line of lines){
    if(RECEIPT_LINE_BLACKLIST.test(line)){ pendingName=''; continue; }
    const priceMatch = line.match(priceAtEnd);
    if(!priceMatch){
      if(/[a-zA-ZñÑáéíóúÁÉÍÓÚ]{3,}/.test(line) && !/\d{3,}/.test(line)){
        const clean = line.replace(/[^\wñÑáéíóúÁÉÍÓÚ\s.&-]/g,'').trim();
        if(clean) pendingName = clean;
      }
      continue;
    }
    const price = normalizeReceiptNumber(priceMatch[1]);
    if(!price || price<=0 || price>100000){ pendingName=''; continue; }
    let rest = line.slice(0, priceMatch.index).trim();
    rest = rest.replace(/[.\-·•]{2,}/g,' ').replace(/\s{2,}/g,' ').trim();
    const tokens = rest.split(' ');

    // Facturas de proveedor suelen traer columnas "cant" y "precio unitario" en medio
    // de la línea (no al principio). Las encontramos verificando cant × precio_unit ≈ total
    // — así no confundimos la cantidad real con un código de producto u otro número suelto.
    let qty = 1, qtyIdx = -1, priceIdx = -1;
    const numericIdxs = [];
    tokens.forEach((tok,idx)=>{ if(bareNumberTok.test(tok)) numericIdxs.push(idx); });
    outer:
    for(const qi of numericIdxs){
      for(const pi of numericIdxs){
        if(qi===pi) continue;
        const qv = normalizeReceiptNumber(tokens[qi]);
        const pv = normalizeReceiptNumber(tokens[pi]);
        if(qv<=0 || qv>=1000 || pv<=0) continue;
        if(Math.abs(qv*pv - price) <= Math.max(0.02, price*0.01)){
          qty = qv; qtyIdx = qi; priceIdx = pi;
          break outer;
        }
      }
    }

    let name, qtyVerified = false;
    const qtyMatch = rest.match(leadingQty);
    const restAfterQty = qtyMatch ? rest.slice(qtyMatch[0].length) : rest;

    if(qtyIdx>-1){
      // La cantidad se cruzó contra el precio (cant × precio_unit ≈ total), así que es confiable
      const nameTokens = tokens.filter((_,idx)=> idx!==qtyIdx && idx!==priceIdx && !/^[xX]$/.test(tokens[idx]));
      name = nameTokens.join(' ').replace(/^[^a-zA-ZñÑáéíóúÁÉÍÓÚ]*/,'').trim();
      qtyVerified = true;
    } else if(qtyMatch && pendingName && !hasRealNameWords(restAfterQty)){
      // La línea es solo "cantidad @ precio" (ej. "1 @ $1.79"), sin nombre propio —
      // el nombre real vino en la línea de arriba
      const q = normalizeReceiptNumber(qtyMatch[1]);
      if(q>0 && q<1000) qty = q;
      name = pendingName;
    } else if(qtyMatch){
      // "2 x Producto ... precio" (con o sin espacio pegado al "x"/"@") — el nombre viene
      // después de la cantidad, usamos restAfterQty en vez de tokens de toda la línea para
      // no arrastrar la cantidad pegada al nombre (ej. "2xManzana" → "Manzana", no "xManzana")
      const q = normalizeReceiptNumber(qtyMatch[1]);
      if(q>0 && q<1000) qty = q;
      const nameTokens = restAfterQty.split(' ').filter(tok=>tok && !bareNumberTok.test(tok) && !/^[xX]$/.test(tok));
      name = nameTokens.join(' ').replace(/^[^a-zA-ZñÑáéíóúÁÉÍÓÚ]*/,'').trim();
    } else {
      // "Producto ... precio", sin ningún indicio de cantidad al principio
      const nameTokens = tokens.filter(tok=>!bareNumberTok.test(tok) && !/^[xX]$/.test(tok));
      name = nameTokens.join(' ').replace(/^[^a-zA-ZñÑáéíóúÁÉÍÓÚ]*/,'').trim();
    }

    pendingName = '';
    if(name.length<2) continue;
    items.push({name, quantity:qty, unit:'unidad', total_price:price, qtyVerified});
    if(items.length>=40) break;
  }

  return {supplier, date, items};
}

async function processReceiptImage(file){
  scanState='loading';
  scanErrorMsg='';
  try{
    const compressed = await fileToBase64(file);
    scanImageBase64 = compressed.base64;
    scanImageMediaType = compressed.mediaType;
    render();

    await loadTesseract();
    let ocrDataUrl;
    try{
      ocrDataUrl = await prepareOcrImage(file);
    }catch(prepErr){
      ocrDataUrl = 'data:'+scanImageMediaType+';base64,'+scanImageBase64;
    }
    let ocrResult;
    try{
      ocrResult = await Tesseract.recognize(ocrDataUrl, 'spa+eng');
    }catch(ocrErr){
      throw new Error(t('err_ocr_read'));
    }
    const rawText = (ocrResult.data && ocrResult.data.text) || '';
    if(!rawText.trim()){ throw new Error(t('err_no_text')); }

    const parsed = parseReceiptText(rawText);

    scanSupplier = parsed.supplier || '';
    scanDate = parsed.date || localDateStr();

    scanExtracted = parsed.items.map(it=>{
      const nameLower = (it.name||'').toLowerCase().trim();
      let matchedId = null;
      // 1. Prioridad: alias aprendido de una corrección manual anterior
      if(aliasMap[nameLower] && inventory.some(ing=>ing.id===aliasMap[nameLower])){
        matchedId = aliasMap[nameLower];
      } else {
        // 2. Coincidencia por texto contenido
        const existing = inventory.find(ing=> nameLower.includes(ing.name.toLowerCase()) || ing.name.toLowerCase().includes(nameLower));
        matchedId = existing ? existing.id : '__new__';
      }
      return {
        rawName: it.name || t('fallback_no_product_name'),
        qty: typeof it.quantity==='number' ? it.quantity : parseFloat(it.quantity)||0,
        totalPrice: typeof it.total_price==='number' ? it.total_price : parseFloat(it.total_price)||0,
        unit: it.unit || 'unidad',
        matchedIngId: matchedId,
        qtyVerified: !!it.qtyVerified
      };
    });

    // Detección de posible recibo duplicado: mismo proveedor + fecha + total aproximado
    const totalSum = scanExtracted.reduce((s,it)=>s+it.totalPrice,0);
    scanDuplicateOf = receipts.find(r=>
      (r.supplier||'').toLowerCase()===(scanSupplier||'').toLowerCase() &&
      r.date===scanDate &&
      Math.abs(r.total-totalSum)<0.5
    ) || null;
    scanDuplicateConfirmed = false;

    scanState='matched';
    render();
  }catch(err){
    scanErrorMsg = err.message || t('err_generic_receipt');
    scanState='error';
    render();
  }
}

function applyScanResults(){
  if(scanDuplicateOf && !scanDuplicateConfirmed) return; // seguridad extra, el botón ya debería estar deshabilitado

  const appliedItems = [];
  const createdPurchaseIds = [];
  scanExtracted.forEach(item=>{
    if(item.qty<=0 || item.totalPrice<=0 || !item.rawName || !item.rawName.trim()) return;
    let ingId = item.matchedIngId;
    let ingName = '';
    if(ingId==='__new__'){
      // La categoría de un ingrediente nuevo creado desde un escaneo se guarda siempre en inglés
      // ("Uncategorized"), igual que el resto de los datos de producto — así el emparejamiento
      // con el OCR nunca se ve afectado por el idioma en el que esté la interfaz al escanear.
      const newIng = {id:uid('i'), name:item.rawName, category:'Uncategorized', unit:item.unit||'unidad', costPerUnit:item.totalPrice/item.qty, updated:true};
      inventory.push(newIng);
      ingId = newIng.id;
      ingName = newIng.name;
    } else {
      const ing = inventory.find(i=>i.id===ingId);
      if(ing){
        ing.costPerUnit = item.totalPrice/item.qty;
        ing.updated = true;
        ingName = ing.name;
      }
    }
    // Aprende la relación nombre-del-recibo -> ingrediente, para reconocerlo solo la próxima vez
    aliasMap[(item.rawName||'').toLowerCase().trim()] = ingId;

    const purchaseId = uid('p');
    purchases.push({id:purchaseId, ingId, qty:item.qty, totalPrice:item.totalPrice, supplier:scanSupplier||t('fallback_scanned'), date:scanDate});
    createdPurchaseIds.push(purchaseId);
    appliedItems.push({rawName:item.rawName, qty:item.qty, unit:item.unit, totalPrice:item.totalPrice, ingName});
  });

  if(appliedItems.length>0){
    receipts.push({
      id:uid('r'), imageBase64:scanImageBase64, mediaType:scanImageMediaType,
      supplier:scanSupplier||t('fallback_unspecified'), date:scanDate,
      total: appliedItems.reduce((s,i)=>s+i.totalPrice,0),
      itemCount: appliedItems.length, appliedItems, createdAt: new Date().toISOString(),
      purchaseIds: createdPurchaseIds
    });
  }
  saveState();
  closeScanModal();
}

/* Borra un recibo y las compras que generó (así el gasto mensual y el historial de
   precio no quedan contaminados con un recibo escaneado por error o duplicado).
   Los recibos guardados antes de este cambio no tienen purchaseIds — en ese caso
   solo se borra el registro del recibo, sin tocar compras. */
function deleteReceipt(receiptId){
  const r = receipts.find(x=>x.id===receiptId);
  if(!r) return;
  if(!confirm(t('confirm_delete_receipt'))) return;
  if(Array.isArray(r.purchaseIds) && r.purchaseIds.length>0){
    const idSet = new Set(r.purchaseIds);
    purchases = purchases.filter(p=>!idSet.has(p.id));
  }
  receipts = receipts.filter(x=>x.id!==receiptId);
  saveState();
  showReceiptDetail = null;
  render();
}

function printReceipt(r){
  const w = window.open('', '_blank');
  if(!w) return; // ventana emergente bloqueada por el navegador
  const rows = r.appliedItems.map(it=>`
    <tr><td>${escapeHtml(it.rawName)}</td><td>${it.qty} ${escapeHtml(unitLabel(it.unit))}</td><td>${money(it.totalPrice)}</td></tr>
  `).join('');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(r.supplier)||t('no_supplier_name')}</title>
    <style>
      body{font-family:-apple-system,sans-serif;padding:24px;color:#1C1C1E;max-width:480px;margin:0 auto;}
      h2{margin:0 0 4px;} .meta{color:#5F6368;font-size:13px;margin-bottom:16px;}
      img{max-width:100%;border-radius:8px;margin-bottom:16px;}
      table{width:100%;border-collapse:collapse;} th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #ddd;font-size:13px;}
      tfoot td{font-weight:700;border-bottom:none;padding-top:10px;}
    </style></head><body>
    <h2>${escapeHtml(r.supplier)||t('no_supplier_name')}</h2>
    <div class="meta">${escapeHtml(r.date)}</div>
    <img src="data:${r.mediaType};base64,${r.imageBase64}">
    <table>
      <thead><tr><th>${t('th_ingredient')}</th><th>${t('lbl_qty_bought')}</th><th>${t('th_cost_unit').split('/')[0]}</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="2">${t('lbl_total_paid')}</td><td>${money(r.total)}</td></tr></tfoot>
    </table>
    </body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

function downloadReceiptImage(r){
  const ext = (r.mediaType||'image/jpeg').includes('png') ? 'png' : 'jpg';
  const a = document.createElement('a');
  a.href = `data:${r.mediaType};base64,${r.imageBase64}`;
  a.download = `receipt-${r.date||'sin-fecha'}.${ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function shareReceipt(r){
  const label = `${r.supplier||t('no_supplier_name')} — ${r.date}`;
  if(navigator.share){
    try{
      const res = await fetch(`data:${r.mediaType};base64,${r.imageBase64}`);
      const blob = await res.blob();
      const ext = (r.mediaType||'image/jpeg').includes('png') ? 'png' : 'jpg';
      const file = new File([blob], `receipt-${r.date||'sin-fecha'}.${ext}`, {type:r.mediaType});
      const shareData = (navigator.canShare && navigator.canShare({files:[file]}))
        ? {files:[file], title:label, text:label}
        : {title:label, text:label};
      await navigator.share(shareData);
      return;
    }catch(e){
      if(e && e.name==='AbortError') return; // el usuario cerró el panel de compartir, no es un error
    }
  }
  // Sin Web Share API disponible (la mayoría de navegadores de escritorio): descarga la foto
  // para que el usuario la comparta a mano por donde prefiera.
  downloadReceiptImage(r);
}

/* ================= EVENTOS ================= */
function attachEvents(){
  document.querySelectorAll('.tab').forEach(t=>{ t.onclick=()=>{ activeTab=t.dataset.tab; render(); }; });
  const btnLangToggle=document.getElementById('btn-lang-toggle');
  if(btnLangToggle) btnLangToggle.onclick=()=>setLang(uiLang==='es'?'en':'es');

  let statMonthNavigating = false;
  document.querySelectorAll('[data-stat-month-nav]').forEach(btn=>{
    btn.onclick=()=>{
      if(statMonthNavigating || btn.disabled) return;
      const months = allMonths();
      const currentMonthKey = months[0] || localMonthStr();
      const viewedMonth = selectedStatMonth || currentMonthKey;
      const idx = months.indexOf(viewedMonth);
      if(idx===-1) return;
      const newIdx = btn.dataset.statMonthNav==='older' ? idx+1 : idx-1;
      if(newIdx<0 || newIdx>=months.length) return;

      statMonthNavigating = true;
      btn.classList.add('pop');
      const ring = btn.querySelector('.month-nav-ring');
      if(ring) ring.classList.add('burst');
      setTimeout(()=>{
        selectedStatMonth = months[newIdx]===currentMonthKey ? null : months[newIdx];
        statMonthNavigating = false;
        render();
      }, 480);
    };
  });
  const statMonthResetBtn = document.querySelector('[data-stat-month-reset]');
  if(statMonthResetBtn) statMonthResetBtn.onclick=()=>{ selectedStatMonth=null; render(); };

  const btnOpenMonthlySpend = document.getElementById('btn-open-monthly-spend');
  if(btnOpenMonthlySpend) btnOpenMonthlySpend.onclick = openMonthlySpendModal;
  const monthlySpendOverlay = document.getElementById('monthly-spend-overlay');
  if(monthlySpendOverlay){
    monthlySpendOverlay.addEventListener('mousedown',(e)=>{ if(e.target===monthlySpendOverlay) closeMonthlySpendModal(); });
    const closeMonthlySpendBtn = document.getElementById('btn-close-monthly-spend');
    if(closeMonthlySpendBtn) closeMonthlySpendBtn.onclick = closeMonthlySpendModal;
  }

  const btnNewItem=document.getElementById('btn-new-item'); if(btnNewItem) btnNewItem.onclick=()=>openItemModal(null);
  const btnNewPurchase=document.getElementById('btn-new-purchase'); if(btnNewPurchase) btnNewPurchase.onclick=()=>openPurchaseModal();
  const btnNewDish=document.getElementById('btn-new-dish'); if(btnNewDish) btnNewDish.onclick=()=>openDishModal(null);
  const btnLockMenu=document.getElementById('btn-lock-menu');
  if(btnLockMenu) btnLockMenu.onclick=()=>{ menuUnlocked=false; pinEntry=''; pinError=''; render(); };
  const btnAlertSettings=document.getElementById('btn-alert-settings');
  if(btnAlertSettings) btnAlertSettings.onclick=()=>{ draftThreshold=priceAlertThreshold; showAlertSettingsModal=true; render(); };

  const alertSettingsOverlay=document.getElementById('alert-settings-overlay');
  if(alertSettingsOverlay){
    alertSettingsOverlay.addEventListener('mousedown',(e)=>{ if(e.target===alertSettingsOverlay){ showAlertSettingsModal=false; render(); } });
    const cancelAlertBtn=document.getElementById('btn-cancel-alert-settings');
    if(cancelAlertBtn) cancelAlertBtn.onclick=()=>{ showAlertSettingsModal=false; render(); };
    const saveAlertBtn=document.getElementById('btn-save-alert-settings');
    if(saveAlertBtn) saveAlertBtn.onclick=()=>{
      const val=parseFloat(document.getElementById('alert-threshold-input').value);
      if(val>0) priceAlertThreshold=val;
      saveState();
      showAlertSettingsModal=false; render();
    };
  }

  document.querySelectorAll('[data-pin-digit]').forEach(btn=>{
    btn.onclick=()=>{
      if(pinEntry.length>=4) return;
      pinEntry += btn.dataset.pinDigit;
      pinError='';
      if(pinEntry.length===4){
        const attempt=pinEntry;
        checkPin(attempt).then(ok=>{
          if(pinEntry!==attempt) return; // el usuario ya borró/reinició mientras se verificaba
          if(ok){
            menuUnlocked=true; pinEntry=''; pinError='';
            render();
          } else {
            pinError=t('pin_error');
            render();
            setTimeout(()=>{ if(pinEntry===attempt){ pinEntry=''; render(); } }, 500);
          }
        });
        return;
      }
      render();
    };
  });
  const pinBack=document.querySelector('[data-pin-back]');
  if(pinBack) pinBack.onclick=()=>{ pinEntry=pinEntry.slice(0,-1); pinError=''; render(); };
  const btnScanFab=document.getElementById('btn-scan-fab');
  if(btnScanFab) btnScanFab.onclick=openScanModal;

  document.querySelectorAll('[data-view-receipt]').forEach(card=>{
    card.onclick=()=>{ showReceiptDetail=card.dataset.viewReceipt; render(); };
  });
  const receiptDetailOverlay=document.getElementById('receipt-detail-overlay');
  if(receiptDetailOverlay){
    receiptDetailOverlay.addEventListener('mousedown',(e)=>{ if(e.target===receiptDetailOverlay){ showReceiptDetail=null; render(); } });
    const closeBtn=document.getElementById('btn-close-receipt-detail');
    if(closeBtn) closeBtn.onclick=()=>{ showReceiptDetail=null; render(); };
    const currentReceipt = receipts.find(x=>x.id===showReceiptDetail);
    const deleteBtn=document.getElementById('btn-delete-receipt');
    if(deleteBtn && currentReceipt) deleteBtn.onclick=()=>deleteReceipt(currentReceipt.id);
    const printBtn=document.getElementById('btn-print-receipt');
    if(printBtn && currentReceipt) printBtn.onclick=()=>printReceipt(currentReceipt);
    const shareBtn=document.getElementById('btn-share-receipt');
    if(shareBtn && currentReceipt) shareBtn.onclick=()=>shareReceipt(currentReceipt);
  }

  const btnScanFromReceipts=document.getElementById('btn-scan-from-receipts');
  if(btnScanFromReceipts) btnScanFromReceipts.onclick=openScanModal;
  const receiptSearchInp=document.getElementById('receipt-search');
  if(receiptSearchInp) receiptSearchInp.oninput=(e)=>{
    // render() reemplaza el innerHTML entero (recrea el <input>), así que sin esto
    // el cursor/foco se perdería en cada letra que se escribe en la búsqueda
    const cursorPos = e.target.selectionStart;
    receiptSearchQuery = e.target.value;
    render();
    const freshInp = document.getElementById('receipt-search');
    if(freshInp){ freshInp.focus(); freshInp.setSelectionRange(cursorPos, cursorPos); }
  };

  document.querySelectorAll('[data-history-item]').forEach(b=>{ b.onclick=()=>openPriceHistoryModal(b.dataset.historyItem); });
  const priceHistoryOverlay=document.getElementById('price-history-overlay');
  if(priceHistoryOverlay){
    priceHistoryOverlay.addEventListener('mousedown',(e)=>{ if(e.target===priceHistoryOverlay) closePriceHistoryModal(); });
    const closeHistoryBtn=document.getElementById('btn-close-price-history');
    if(closeHistoryBtn) closeHistoryBtn.onclick=closePriceHistoryModal;
  }

  document.querySelectorAll('[data-edit-item]').forEach(b=>{ b.onclick=()=>openItemModal(inventory.find(i=>i.id===b.dataset.editItem)); });
  document.querySelectorAll('[data-del-item]').forEach(b=>{ b.onclick=()=>{ inventory=inventory.filter(i=>i.id!==b.dataset.delItem); saveState(); render(); }; });
  document.querySelectorAll('[data-edit-dish]').forEach(b=>{ b.onclick=()=>openDishModal(dishes.find(d=>d.id===b.dataset.editDish)); });
  document.querySelectorAll('[data-del-dish]').forEach(b=>{ b.onclick=()=>{ dishes=dishes.filter(d=>d.id!==b.dataset.delDish); saveState(); render(); }; });

  /* Modal ingrediente */
  const itemOverlay=document.getElementById('item-overlay');
  if(itemOverlay){
    itemOverlay.addEventListener('mousedown',(e)=>{ if(e.target===itemOverlay) closeItemModal(); });
    document.getElementById('btn-cancel-item').onclick=closeItemModal;
    document.getElementById('btn-save-item').onclick=()=>{
      const name=document.getElementById('fi-name').value.trim();
      if(!name) return;
      const item={
        id:draftItem.id, name,
        category:document.getElementById('fi-cat').value.trim(),
        unit:document.getElementById('fi-unit').value,
        costPerUnit:parseFloat(document.getElementById('fi-cost').value)||0,
        updated:draftItem.updated||false
      };
      if(editingItem){ const idx=inventory.findIndex(i=>i.id===editingItem); inventory[idx]=item; }
      else inventory.push(item);
      saveState();
      closeItemModal();
    };
  }

  /* Modal compra manual */
  const purchaseOverlay=document.getElementById('purchase-overlay');
  if(purchaseOverlay){
    purchaseOverlay.addEventListener('mousedown',(e)=>{ if(e.target===purchaseOverlay) closePurchaseModal(); });
    document.getElementById('btn-cancel-purchase').onclick=closePurchaseModal;
    document.getElementById('btn-save-purchase').onclick=()=>{
      const ingId=document.getElementById('pf-ing').value;
      const qty=parseFloat(document.getElementById('pf-qty').value);
      const totalPrice=parseFloat(document.getElementById('pf-price').value);
      const supplier=document.getElementById('pf-supplier').value.trim()||t('fallback_unspecified');
      const date=document.getElementById('pf-date').value;
      if(!ingId||!qty||!totalPrice) return;
      purchases.push({id:uid('p'), ingId, qty, totalPrice, supplier, date});
      const ing=inventory.find(i=>i.id===ingId);
      if(ing){ ing.costPerUnit=totalPrice/qty; ing.updated=true; }
      saveState();
      closePurchaseModal();
    };
  }

  /* Modal plato */
  const dishOverlay=document.getElementById('dish-overlay');
  if(dishOverlay){
    dishOverlay.addEventListener('mousedown',(e)=>{ if(e.target===dishOverlay) closeDishModal(); });
    document.getElementById('btn-cancel-dish').onclick=closeDishModal;
    document.getElementById('f-name').oninput=(e)=>draftDish.name=e.target.value;
    document.getElementById('f-cat').oninput=(e)=>draftDish.category=e.target.value;
    document.getElementById('f-price').oninput=(e)=>draftDish.price=parseFloat(e.target.value)||0;
    document.querySelectorAll('[data-remove-item]').forEach(b=>{ b.onclick=()=>{ draftDish.items.splice(parseInt(b.dataset.removeItem),1); render(); }; });
    const btnAddItem=document.getElementById('btn-add-item');
    if(btnAddItem){
      btnAddItem.onclick=()=>{
        const sel=document.getElementById('add-ing-select');
        const qtyInp=document.getElementById('add-ing-qty');
        const qty=parseFloat(qtyInp.value);
        if(sel.value && qty>0){ draftDish.items.push({ingId:sel.value, qty}); render(); }
      };
    }
    document.getElementById('btn-save-dish').onclick=()=>{
      if(!draftDish.name || !draftDish.price) return;
      if(editingDish){ const idx=dishes.findIndex(d=>d.id===editingDish); dishes[idx]=draftDish; }
      else dishes.push(draftDish);
      saveState();
      closeDishModal();
    };
  }

  /* Modal escaneo de recibo */
  const scanOverlay=document.getElementById('scan-overlay');
  if(scanOverlay){
    scanOverlay.addEventListener('mousedown',(e)=>{ if(e.target===scanOverlay) closeScanModal(); });
    document.getElementById('btn-cancel-scan').onclick=closeScanModal;

    const dz=document.getElementById('drop-zone');
    const fileInput=document.getElementById('receipt-file');
    if(dz && fileInput){
      dz.onclick=()=>fileInput.click();
      fileInput.onchange=(e)=>{ if(e.target.files[0]) processReceiptImage(e.target.files[0]); };
    }

    const retryBtn=document.getElementById('btn-retry-scan');
    if(retryBtn) retryBtn.onclick=()=>{ scanState='idle'; scanImageBase64=null; render(); };
    const fallbackBtn=document.getElementById('btn-fallback-manual');
    if(fallbackBtn) fallbackBtn.onclick=()=>{ closeScanModal(); openPurchaseModal(); };

    document.querySelectorAll('[data-scan-name]').forEach(inp=>{
      inp.onchange=()=>{ scanExtracted[parseInt(inp.dataset.scanName)].rawName=inp.value; render(); };
    });
    document.querySelectorAll('[data-scan-match]').forEach(sel=>{
      sel.onchange=()=>{ scanExtracted[parseInt(sel.dataset.scanMatch)].matchedIngId=sel.value; render(); };
    });
    document.querySelectorAll('[data-scan-qty]').forEach(inp=>{
      inp.onchange=()=>{ const it=scanExtracted[parseInt(inp.dataset.scanQty)]; it.qty=parseFloat(inp.value)||0; it.qtyVerified=true; render(); };
    });
    document.querySelectorAll('[data-scan-price]').forEach(inp=>{
      inp.onchange=()=>{ scanExtracted[parseInt(inp.dataset.scanPrice)].totalPrice=parseFloat(inp.value)||0; render(); };
    });
    document.querySelectorAll('[data-remove-scan-item]').forEach(b=>{
      b.onclick=()=>{ scanExtracted.splice(parseInt(b.dataset.removeScanItem),1); render(); };
    });
    const addScanItemBtn=document.getElementById('btn-add-scan-item');
    if(addScanItemBtn) addScanItemBtn.onclick=()=>{
      scanExtracted.push({rawName:'', qty:1, totalPrice:0, unit:'unidad', matchedIngId:'__new__', qtyVerified:true});
      render();
    };

    const supplierInp=document.getElementById('scan-supplier');
    if(supplierInp) supplierInp.oninput=(e)=>scanSupplier=e.target.value;
    const dateInp=document.getElementById('scan-date');
    if(dateInp) dateInp.oninput=(e)=>scanDate=e.target.value;
    const dupCheck=document.getElementById('scan-dup-confirm');
    if(dupCheck) dupCheck.onchange=(e)=>{ scanDuplicateConfirmed=e.target.checked; render(); };

    const applyBtn=document.getElementById('btn-apply-scan');
    if(applyBtn) applyBtn.onclick=applyScanResults;
  }
}

function closeItemModal(){ showItemModal=false; editingItem=null; draftItem=null; render(); }
function closePurchaseModal(){ showPurchaseModal=false; render(); }
function closeDishModal(){ showDishModal=false; editingDish=null; draftDish=null; render(); }

loadState();
render();
</script>
</body>
</html>
